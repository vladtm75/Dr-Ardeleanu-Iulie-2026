</script>
<script>
(function(){
  var ACTIVE = "jul";
  var CLASS = "plMonthBar";
  var LABEL = "RAPOARTE LUNARE";
  var MONTHS = [
    {k:'jan',l:'Ianuarie 2026',h:'pl-desktop-jan-2026.html'},
    {k:'feb',l:'Februarie 2026',h:'pl-desktop-feb-2026.html'},
    {k:'mar',l:'Martie 2026',h:'pl-desktop-mar-2026.html'},
    {k:'apr',l:'Aprilie 2026',h:'pl-desktop-apr-2026.html'},
    {k:'may',l:'Mai 2026',h:'pl-desktop-may-2026.html'},
    {k:'jun',l:'Iunie 2026',h:'pl-desktop-jun-2026.html'},
    {k:'jul',l:'Iulie 2026',h:'pl-desktop.html'}
  ];
  var BURG=["123, 28, 22","142, 32, 25","92, 21, 16","101, 21, 17","94, 21, 15"];
  function isB(e){var cs=getComputedStyle(e),s=cs.backgroundColor+" "+cs.backgroundImage;
    for(var i=0;i<BURG.length;i++){if(s.indexOf(BURG[i])>-1)return true;}return false;}
  function findHeader(){
    var vw=window.innerWidth,els=document.querySelectorAll('header,div,section');
    for(var i=0;i<els.length;i++){var e=els[i];
      if(e.className&&(""+e.className).indexOf('drNav')>-1)continue;
      if(e.className&&(""+e.className).indexOf(CLASS)>-1)continue;
      var r=e.getBoundingClientRect();
      if(r.top>200||r.width<vw*0.4||r.height<36||r.height>200)continue;
      if(isB(e))return e;}
    return null;}
  function removeLegendChips(root){
    // strips the "Jun 25 Actual / Jun 26 Actual / Jun 26 Budget" legend chips —
    // a colored dot + label pair, redundant next to the Month/YTD toggle
    var all = root.querySelectorAll('div');
    for (var i=0; i<all.length; i++){
      var e = all[i];
      if (e.children.length !== 2) continue;
      var dot = e.children[0], txt = e.children[1];
      var dotCs = getComputedStyle(dot);
      var isDot = dot.tagName==='SPAN' && parseInt(dotCs.borderRadius)>=50 &&
        dot.getBoundingClientRect().width < 14 && dot.getBoundingClientRect().height < 14;
      if (isDot && txt.tagName==='SPAN' && /Actual|Budget/.test(txt.textContent)){
        e.parentNode.removeChild(e);
      }
    }
  }
  function build(){
    var bar=document.createElement('div');
    bar.className=CLASS;
    bar.style.cssText='background:#FFFFFF;border-bottom:1px solid #F0F0F0;padding:9px 28px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-family:"Poppins",system-ui,-apple-system,sans-serif;';
    var lbl=document.createElement('span');
    lbl.style.cssText='font-size:9px;font-weight:600;color:#C9A227;margin-right:6px;text-transform:uppercase;letter-spacing:1.6px;';
    lbl.textContent=LABEL;
    bar.appendChild(lbl);
    MONTHS.forEach(function(m){
      var a=document.createElement('a');
      a.href=m.h; a.textContent=m.l;
      var on=(m.k===ACTIVE);
      a.style.cssText='padding:5px 14px;border-radius:20px;border:1px solid '+(on?'#7B1C16':'#E6E0DA')+';'+
        'background:'+(on?'#7B1C16':'#FFFFFF')+';color:'+(on?'#FFFFFF':'#5A5A5A')+';'+
        'box-shadow:'+(on?'0 2px 6px rgba(123,28,22,0.28)':'none')+';'+
        'font-weight:'+(on?'700':'500')+';font-size:11px;text-decoration:none;font-family:inherit;white-space:nowrap;';
      bar.appendChild(a);
    });
    return bar;
  }
  var tries=0;
  function mount(){
    if(document.querySelector('.'+CLASS))return;
    var h=findHeader();
    if(!h){ if(++tries<40){setTimeout(mount,200);} return; }
    removeLegendChips(h);
    h.parentNode.insertBefore(build(), h.nextSibling);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(mount,350); });
  else setTimeout(mount,350);
})();
</script>
</body>
</html>
