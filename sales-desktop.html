    v,
    mom: (v!=null && vPrev!=null && vPrev>=10) ? Math.round((v-vPrev)/vPrev*100) : null,
    yoy: (v!=null && vYoy!=null && vYoy>=10) ? Math.round((v-vYoy)/vYoy*100) : null,

    vsAvg12: (v!=null && avg12!=null && avg12>=10) ? Math.round((v-avg12)/avg12*100) : null,

// Sumă cumulată pe intervalul [fromIdx,toIdx] (indecși în seria de 18 luni), ignorând lunile fără
// dată digitizată (null) — folosit pentru YTD-urile de Pacienți (P0) în tab-urile Pacienți/Cluster/Clinică.
const p0YtdSum = (arr,fromIdx,toIdx) => {
  if(toIdx<fromIdx) return null;
  const vals = (arr||[]).slice(Math.max(0,fromIdx),toIdx+1).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
};
// YTD 26 vs YTD 25 pe FERESTRE EGALE — Ian 25 nu există în nicio prezentare (index -1, structural
// inexistent), deci un YTD "clasic" Ian26→lună curentă (N luni) comparat cu Ian25→lună curentă (N-1
// luni, din cauza lacunei) ar infla artificial creșterea (compară mai multe luni din 2026 cu mai puține
// din 2025). Corect: aliniem AMBELE ferestre la aceeași lungime (numărul de luni efectiv disponibile în
// 2025, terminând în luna curentă), sacrificând Ianuarie din fereastra 2026 dacă e nevoie. Bug prins de
// utilizator ("arată prea bine") — YTD YoY era sistematic supraestimat înainte de acest fix.
const p0YtdPair = (arr, ei) => {
  const from25raw = PATIENTS_OFF-12, to25 = ei-12;
  const from25 = Math.max(0, from25raw);
  const months = to25 - from25 + 1;
  if(months<=0) return {ytd26:null, ytd25:null};
  const from26 = ei - months + 1;
  return {ytd26: p0YtdSum(arr, from26, ei), ytd25: p0YtdSum(arr, from25, to25)};
};

const sum  = (arr) => (arr||[]).reduce((a,b)=>a+(b||0),0);
const ytd  = (arr,n) => sum((arr||[]).slice(0,n));
const gr   = (a,b) => (b&&b!==0) ? ((a-b)/b)*100 : null;
const fmt  = (v) => {
  if(v==null||isNaN(v)) return '—';
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(0)+'K';
  return v.toFixed(0);
};
const pct  = (v) => v==null ? '—' : (v>0?'+':'')+v.toFixed(1)+'%';
const pct0 = (v) => v==null ? '—' : (v>0?'+':'')+Math.round(v)+'%';
const pcol = (v) => v==null ? P.muted : v>=10 ? '#2D7D46' : v>=0 ? '#5A9E6B' : P.alert;

const val = (clinic, yr, period) => {
  const a = clinic.actuals?.[yr]; if(!a) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='YTD') {
    const slice = a.slice(0, ACT_MO);
    if (slice.every(x=>x==null)) return null;
    return slice.reduce((s,v)=>s+(v||0),0);
  }
  const nonNull = a.filter(x=>x!==null);
  return nonNull.length ? sum(nonNull) : null;
};
const bval = (clinic, yr, period) => {
  const a = clinic.budget?.[yr]; if(!a||a.every(x=>x==null)) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='Annual') return sum(a.filter(x=>x!==null));
  return ytd(a, ACT_MO);
};
const netv = (period) => {
  const a=NET.actuals[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a.filter(x=>x!==null));
};
const netb = (period) => {
  const a=NET.budget[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a);
};
const pLabel = (p) => p==='Month'?MONTHS[ACT_MO-1]+' 2026':p==='YTD'?'YTD Ian–'+MONTHS[ACT_MO-1]+' 2026':'Full Year';

function buildClinicDataRows(clinic) {
  const rows = [];
  const actYears = Object.keys(clinic.actuals).map(Number).sort();
  // Actuals per year
  actYears.forEach(yr => {
    const arr = clinic.actuals[yr];
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: arr[i]??null})),
      total: arr.filter(x=>x!=null).length ? sum(arr.filter(x=>x!=null)) : null,
    });
  });
  // Budget 2026 if exists
  const bgt = clinic.budget?.[2026];
  if(bgt && !bgt.every(x=>x==null)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgt[i]??null})),
      total: sum(bgt.filter(x=>x!=null)),
    });
    // Δ Actual vs Budget row
    const act2026 = clinic.actuals?.[2026];
    if(act2026) {
      const deltaVals = MONTHS.map((_,i) => {
        const a = act2026[i], b = bgt[i];
        return (a!=null && b!=null) ? a - b : null;
      });
      const deltaTotal = deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null;
      rows.push({
        label: 'Δ Actual vs Buget',
        isDelta: true,
        cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
        total: deltaTotal,
      });
    }
  }
  return rows;
}

function buildNetworkDataRows(period) {
  const rows = [];
  [2022,2023,2024,2025,2026].forEach(yr => {
    const arr = NET.actuals[yr];
    if(!arr) return;
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: arr[i]??null})),
      total: arr.filter(x=>x!=null).length ? sum(arr.filter(x=>x!=null)) : null,
    });
  });
  rows.push({
    label: 'Budget 2026',
    isBudget: true,
    cells: MONTHS.map((_,i) => ({v: NET.budget[2026][i]??null})),
    total: sum(NET.budget[2026]),
  });
  // Δ Actual vs Budget
  const act2026 = NET.actuals[2026];
  const bgt2026 = NET.budget[2026];
  const deltaVals = MONTHS.map((_,i) => (act2026[i]!=null && bgt2026[i]!=null) ? act2026[i]-bgt2026[i] : null);
  rows.push({
    label: 'Δ Actual vs Buget',
    isDelta: true,
    cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
    total: deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null,
  });
  return rows;
}

function buildClusterDataRows(codes) {
  const rows = [];
  [2023,2024,2025,2026].forEach(yr => {
    const totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[yr]?.[i]||0), 0));
    const hasData = totals.some(v=>v>0);
    if(!hasData) return;
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: totals[i]||null})),
      total: sum(totals.filter(v=>v>0)),
    });
  });
  // Budget 2026
  const bgtTotals = MONTHS.map((_,i) => codes.reduce((acc,c) => {
    const b = CD[c].budget?.[2026]; return acc + (b?.[i]||0);
  }, 0));
  if(bgtTotals.some(v=>v>0)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgtTotals[i]||null})),
      total: sum(bgtTotals),
    });
    // Δ Actual vs Budget
    const act2026totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[2026]?.[i]||0), 0));
    const deltaVals = MONTHS.map((_,i) => (act2026totals[i]>0 && bgtTotals[i]>0) ? act2026totals[i]-bgtTotals[i] : null);
    rows.push({
      label: 'Δ Actual vs Buget',
      isDelta: true,
      cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
      total: deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null,
    });
  }
  return rows;
}

const NoteKpi = ({v,l}) => (
  <div style={{flex:'1 1 0',minWidth:88,padding:'9px 12px',background:'#FAFAFA',border:`1px solid ${P.border}`,borderRadius:8}}>
    <div style={{fontSize:16,fontWeight:800,color:P.primary,lineHeight:1.15}}>{v}</div>

);

function CompetitorNote({n, isOpen, onToggle}){
  return (
    <div style={{border:`1px solid ${P.border}`,borderRadius:10,overflow:'hidden',background:P.white,marginBottom:12,boxShadow:'0 1px 3px rgba(0,0,0,0.04)'}}>
      {/* Header */}
      <div onClick={onToggle} style={{
        display:'flex',alignItems:'center',gap:10,padding:'11px 16px',cursor:'pointer',
        background: n.verified ? '#FBF6F6' : '#FAFAFA',
        borderBottom: isOpen ? `1px solid ${P.border}` : 'none',
      }}>
        <span style={{fontSize:11,color:P.muted,width:10}}>{isOpen?'▾':'▸'}</span>
        <span style={{fontSize:13,fontWeight:800,color:P.primary,fontFamily:"'Playfair Display',serif"}}>{n.op}</span>
        <span style={{fontSize:11,color:'#555'}}>· {n.city}</span>
        {n.site && <span style={{fontSize:10,color:P.muted}}>· {n.site}</span>}
        <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          {n.verified
            ? <span style={{fontSize:9,fontWeight:700,letterSpacing:0.6,padding:'3px 8px',borderRadius:20,background:'#DCFCE7',color:'#15803D'}}>VERIFICAT {n.checked}</span>
            : <span style={{fontSize:9,fontWeight:700,letterSpacing:0.6,padding:'3px 8px',borderRadius:20,background:'#FFFBEB',color:'#92400E',border:'1px solid #FDE68A'}}>NEVERIFICAT</span>}
        </span>
      </div>

      {isOpen && (
        <div style={{padding:'14px 16px 16px'}}>
          {/* Executive summary */}
          <div style={{fontSize:12.5,lineHeight:1.65,color:P.text,marginBottom:n.kpis?13:0}}>{n.summary}</div>

          {n.kpis && (
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:15}}>
              {n.kpis.map(([v,l])=><NoteKpi key={l} v={v} l={l}/>)}
            </div>
          )}

          {n.entities && (<>
            <Sec>Societăți în perimetru (CAEN 8623)</Sec>
            <div style={{border:`1px solid ${P.border}`,borderRadius:8,overflow:'hidden',marginBottom:15}}>
              <div style={{display:'grid',gridTemplateColumns:'210px 88px 78px 74px 52px 1fr',background:'#F8F4F4',borderBottom:`1px solid ${P.border}`}}>
                {['Societate','CUI','Înființată','CA 2025','Ang.','Rol în grup'].map(h=>(
                  <div key={h} style={{padding:'6px 9px',fontSize:9,fontWeight:700,color:P.primary,textTransform:'uppercase',letterSpacing:0.5}}>{h}</div>
                ))}
              </div>
              {n.entities.map((e,i)=>(
                <div key={i} style={{display:'grid',gridTemplateColumns:'210px 88px 78px 74px 52px 1fr',borderBottom:i<n.entities.length-1?`1px solid #F2F2F2`:'none',background:i%2?'#FCFCFC':P.white}}>
                  <div style={{padding:'7px 9px',fontSize:10.5,fontWeight:700,color:P.text}}>{e[0]}</div>
                  <div style={{padding:'7px 9px',fontSize:10,color:P.muted,fontVariantNumeric:'tabular-nums'}}>{e[1]}</div>
                  <div style={{padding:'7px 9px',fontSize:10,color:'#555'}}>{e[2]}</div>
                  <div style={{padding:'7px 9px',fontSize:10.5,fontWeight:700,color:P.primary,textAlign:'right'}}>{e[3]}</div>
                  <div style={{padding:'7px 9px',fontSize:10,color:'#555',textAlign:'center'}}>{e[4]}</div>
                  <div style={{padding:'7px 9px',fontSize:10,color:'#666',lineHeight:1.45}}>{e[5]}</div>
                </div>
              ))}
            </div>
          </>)}

          {n.locations && (<>
            <Sec>Locații & deschideri</Sec>
            <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:15}}>
              {n.locations.map((l,i)=>(
                <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,fontSize:11.5}}>
                  <span style={{minWidth:96,fontSize:9.5,fontWeight:700,color:P.white,background:l[0]==='în construcție'?P.alert:(l[0]==='nedatat'||l[0]==='revendicat')?P.amber:P.primary,borderRadius:3,padding:'3px 7px',textAlign:'center'}}>{l[0]}</span>
                  <span style={{fontWeight:700,color:P.text,minWidth:150}}>{l[1]}</span>
                  <span style={{color:P.muted,lineHeight:1.5}}>{l[2]}</span>
                </div>
              ))}
            </div>
          </>)}

          {n.series && (<>
            <Sec>Cifră consolidată grup (mil. RON)</Sec>
            <div style={{display:'flex',gap:6,marginBottom:15,flexWrap:'wrap'}}>
              {n.series.map(([y,v,g])=>(
                <div key={y} style={{flex:'1 1 0',minWidth:78,border:`1px solid ${P.border}`,borderRadius:7,padding:'7px 9px',background:y==='2025'?'#FBF6F6':P.white}}>
                  <div style={{fontSize:9,color:P.muted,fontWeight:700}}>{y}</div>
                  <div style={{fontSize:14,fontWeight:800,color:P.primary,lineHeight:1.2}}>{v.toFixed(2)}</div>
                  <div style={{fontSize:9,fontWeight:700,color:g==null?'#CCC':g>=10?'#15803D':g>=0?P.amber:P.alert}}>{g==null?'—':(g>0?'+':'')+g+'%'}</div>
                </div>
              ))}
            </div>
          </>)}

          {n.flags && (<>
            <Sec>Observații pentru interpretarea tabelului</Sec>
            {n.flags.map(([t,txt],i)=><Pill key={i} type={t}>{txt}</Pill>)}
          </>)}

          {!n.flags && (
            <Pill type="amber">Structura de grup nu a fost încă validată pe CUI. Cifra din tabel poate fi incompletă — vezi cazul Dentrust, unde lipseau 2 din 4 societăți.</Pill>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Network Monthly History (embedded in Rețea tab) ─────────────────────────
// Reproduces the historical monthly sales trend from the MTD report ("Sales YTD
// Trend" chart). Built from the dashboard's own NET monthly actuals (facturat) so
// it stays fully consistent with every other tab.
function NetHistory() {
  const HIST_YEARS = [2022,2023,2024,2025,2026];
  const series = [];
  HIST_YEARS.forEach(yr => {
    const av = NET.actuals[yr]||[];
    const bv = NET.budget[yr]||null;
    MONTHS.forEach((_,i) => {
      const future2026 = (yr===2026 && i>=ACT_MO);   // Iun–Dec 2026: budget only
      const a = future2026 ? null : av[i];
      const b = bv ? bv[i] : null;
      // include a point if there's an actual, or it's a future 2026 month carrying a budget
      if (a==null && !(future2026 && b!=null)) return;
      const both = a!=null && b!=null;
      series.push({
        label:`${MONTHS[i]} ${String(yr).slice(2)}`, value:a, bud:b, year:yr, mi:i, proj:future2026,
        over:  both && a>=b ? [b,a] : null,   // favourable gap band (actual above budget)
        under: both && a<b  ? [a,b] : null,   // unfavourable gap band (actual below budget)
      });
    });
  });

  const actuals = series.filter(d=>d.value!=null);
  const latest  = actuals[actuals.length-1];                 // last actual month (Mai 26)
  const peak    = actuals.reduce((m,d)=>d.value>m.value?d:m, actuals[0]);
  const last12  = actuals.slice(-12);
  const avg12   = Math.round(last12.reduce((a,d)=>a+d.value,0)/last12.length);
  const prevYearSame = actuals.find(d=>d.year===latest.year-1 && d.mi===latest.mi);
  const yoyLatest = prevYearSame ? gr(latest.value, prevYearSame.value) : null;
  const latVsBud  = latest.bud ? gr(latest.value, latest.bud) : null;
  const fyBudget  = sum(NET.budget[2026]);
  const ytdA = NET.actuals[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdB = NET.budget[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdGap = ytdA - ytdB, ytdGapPct = gr(ytdA, ytdB);
  const yearStarts = series.filter(d=>d.mi===0);

  const Stat = ({k,v,vc}) => (
    <span style={{fontSize:11,color:P.muted}}><b style={{color:P.primary}}>{k}:</b> <span style={{color:vc||P.text,fontWeight:600}}>{v}</span></span>
  );

  // Dedicated tooltip — shows actual, budget and the gap (ecart) for the hovered month
  const HistTip = ({active,payload}) => {
    if(!active||!payload?.length) return null;

// ─── Mix pe categorii pentru clinici si clustere (din Sales Split) ─────────────
const mixFor = (codes, period) => {
  const src = CLINIC_MIX[ACT_MO]; if (!src) return null;
  const m = src[period==='Month' ? 'M' : 'Y'];
  const acc = {}; let tot = 0;
  codes.forEach(code => {
    const mix = m[code]; if (!mix) return;
    const sales = val(CD[code], 2026, period) || 0;
    tot += sales;
    for (const k in mix) acc[k] = (acc[k]||0) + mix[k]*sales/100;
  });
  if (!tot) return null;
  const out = {};
  for (const k in acc) out[k] = acc[k]/tot*100;
  return {pct: out, sales: tot};
};

        Folosirea ponderii izolează evoluția mix-ului de expansiunea rețelei (TGV deschis mid-2025, FCS Mar 2026, BRL Nov 2026 — clinici non-comparabile YoY).

}


// ─── Buget vs Realizat · Lunar per Clinică (Ian–Dec 2026) ─────────────────────
// Bugetul se vede integral pe tot anul, indiferent de luna selectată în raport.
// Realizatul (actual) se afișează doar până la luna selectată (ACT_MO) — restul anului e "plan".
function MonthlyBudgetCard() {
  const [mode, setMode] = useState('pct'); // 'pct' | 'ron'
  const [expand, setExpand] = useState(null); // clinic code or null

  const rows = Object.values(CD).map(c=>{
    const act = MB_MONTHS.map((_,i)=> i<ACT_MO ? (c.actuals[2026]?.[i] ?? null) : null);
    const bud = MB_MONTHS.map((_,i)=> c.budget?.[2026]?.[i] ?? null);
    const has = bud.some(x=>x!=null);
    const fyBudget = bud.some(x=>x!=null) ? sum(bud.filter(x=>x!=null)) : null;
    return {...c, act, bud, has, fyBudget};
  }).filter(r=>r.has);

  const totAct = MB_MONTHS.map((_,i)=> i<ACT_MO ? NET.actuals[2026][i] : null);
  const totBud = MB_MONTHS.map((_,i)=> NET.budget[2026][i]);
  const totFYBudget = sum(totBud.filter(x=>x!=null));

  const heat = (v) => {
    if(v==null) return 'transparent';
    const t = Math.max(-1,Math.min(1, v/25));
    return t>=0 ? `rgba(21,128,61,${(0.07+0.32*t).toFixed(3)})` : `rgba(217,48,37,${(0.07+0.32*(-t)).toFixed(3)})`;
  };

  // Budget is always the dominant figure in every cell; the secondary line depends on mode/period.
  const Cell = ({a,b,mi,bold}) => {
    const isFuture = mi>=ACT_MO;
    const v = (!isFuture && a!=null && b!=null && b!==0) ? ((a-b)/b*100) : null;
    if(b==null) return <span style={{color:P.muted,fontSize:10}}>—</span>;
    return <div>
      <div style={{fontSize:bold?12:11.5,fontWeight:800,color:isFuture?P.amber:'#92660a'}}>{fmt(b)}</div>
      {mode==='pct'
        ? (isFuture
            ? <div style={{fontSize:8.5,color:P.muted,marginTop:2,fontStyle:'italic',letterSpacing:0.3}}>plan</div>
            : <div style={{fontSize:9.5,fontWeight:700,marginTop:2,color:v==null?P.muted:v>=0?'#15803D':P.alert}}>{v!=null?pct0(v):'—'}</div>)
        : (isFuture
            ? <div style={{fontSize:8.5,color:P.muted,marginTop:2,fontStyle:'italic',letterSpacing:0.3}}>plan</div>
            : <div style={{fontSize:9,color:a!=null?P.text:P.muted,marginTop:2}}>{a!=null?'act '+fmt(a):'—'}</div>)
      }
    </div>;
  };

  return (
    <Card style={{marginBottom:16,padding:0,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
      <div style={{background:P.primary,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:P.white,fontFamily:"'Playfair Display',serif",letterSpacing:0.3}}>Buget 2026 · Lunar per Clinică</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.55)',marginTop:2,letterSpacing:0.5}}>Ianuarie – Decembrie 2026 · realizat până în {MONTHS_FULL[ACT_MO-1]} · sursă: slide W31 Buget 2026</div>
        </div>
        <div style={{display:'flex',alignItems:'center',background:'rgba(0,0,0,0.25)',borderRadius:20,padding:3,gap:2}}>
          {[['pct','Abatere %'],['ron','RON']].map(([v,l])=>{ const on=mode===v; return (
            <button key={v} onClick={()=>setMode(v)} style={{
              background:on?'#ffffff':'transparent',color:on?P.primary:'rgba(255,255,255,0.7)',
              border:'none',cursor:'pointer',borderRadius:16,padding:'4px 13px',
              fontSize:10.5,fontWeight:700,fontFamily:"'Poppins',sans-serif",letterSpacing:'0.03em',
            }}>{l}</button>
          );})}
        </div>
      </div>

      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,tableLayout:'auto'}}>
          <thead>
            <tr style={{background:'#F8F4F4'}}>
              <th style={{padding:'9px 16px',textAlign:'left',fontWeight:700,color:P.primary,fontSize:11,borderBottom:`1px solid ${P.border}`,minWidth:120}}>Clinică</th>
              {MB_MONTHS.map((m,mi)=>{ const isFuture=mi>=ACT_MO; return (
                <th key={m} style={{padding:'9px 6px',textAlign:'center',fontWeight:isFuture?600:700,color:isFuture?P.amber:P.muted,fontSize:10,borderBottom:`1px solid ${P.border}`,background:isFuture?`${P.amber}0D`:'transparent',borderLeft:mi===ACT_MO?`2px dashed ${P.amber}66`:'none'}}>
                  {m}{isFuture&&<div style={{fontSize:7.5,fontWeight:600,letterSpacing:0.4,marginTop:1}}>PLAN</div>}
                </th>
              );})}
              <th style={{padding:'9px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:10,borderBottom:`1px solid ${P.border}`,borderLeft:`3px solid ${P.amber}55`,background:`${P.amber}12`}}>Buget FY26</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r=>{
              const isC1=r.cluster===1;
              const isOpen=expand===r.code;
              return (
                <React.Fragment key={r.code}>
                <tr style={{borderBottom:`1px solid #F0F0F0`,cursor:'pointer'}}
                  onClick={()=>setExpand(isOpen?null:r.code)}
                  onMouseEnter={e=>e.currentTarget.style.background='#FDF5F5'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <td style={{padding:'9px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{width:3,height:22,borderRadius:2,background:isC1?P.primary:P.olive,flexShrink:0}}/>
                      <div style={{fontWeight:700,color:P.primary,fontSize:11}}>{r.name}</div>
                      <span style={{fontSize:9,color:P.muted,marginLeft:2,transform:isOpen?'rotate(90deg)':'none',transition:'transform 0.15s',display:'inline-block'}}>▸</span>
                    </div>
                  </td>
                  {MB_MONTHS.map((m,mi)=>{
                    const a=r.act[mi], b=r.bud[mi];
                    const isFuture=mi>=ACT_MO;
                    const v=(!isFuture&&a!=null&&b!=null&&b!==0)?((a-b)/b*100):null;
                    return (
                      <td key={m} style={{padding:'6px 4px',textAlign:'center',background:isFuture?`${P.amber}0D`:(mode==='pct'?heat(v):'transparent'),borderLeft:mi===ACT_MO?`2px dashed ${P.amber}44`:'none'}}>
                        <Cell a={a} b={b} mi={mi}/>
                      </td>
                    );
                  })}
                  <td style={{padding:'6px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:11.5,borderLeft:`3px solid ${P.amber}33`,background:`${P.amber}08`}}>{fmt(r.fyBudget)}</td>
                </tr>
                {isOpen && (
                  <tr>
                    <td colSpan={MB_MONTHS.length+2} style={{padding:'6px 16px 16px',background:'#FCFAF9'}}>
                      <ResponsiveContainer width="100%" height={160}>
                        <ComposedChart data={MB_MONTHS.map((m,mi)=>({month:m,Actual:r.act[mi],Buget:r.bud[mi]}))} barCategoryGap="34%">
                          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
                          <XAxis dataKey="month" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
                          <YAxis tickFormatter={v=>fmt(v)} tick={{fontSize:9,fill:P.muted}} axisLine={false} tickLine={false} width={44}/>
                          <Tooltip content={<Tip/>}/>
                          <Bar dataKey="Actual" fill={isC1?P.primary:P.olive} radius={[3,3,0,0]} name="Actual" barSize={18}/>
                          <Line type="monotone" dataKey="Buget" stroke={P.amber} strokeWidth={2} strokeDasharray="5 4" dot={{r:3,fill:P.amber,strokeWidth:0}} name="Buget" connectNulls/>
                        </ComposedChart>
                      </ResponsiveContainer>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
            {/* TOTAL RETEA */}
            <tr style={{borderTop:`2px solid ${P.primary}`,background:`linear-gradient(90deg,${P.primary}08 0%,${P.primary}03 100%)`}}>
              <td style={{padding:'10px 16px',fontWeight:800,color:P.primary,fontSize:11.5,fontFamily:"'Playfair Display',serif"}}>TOTAL REȚEA</td>
              {MB_MONTHS.map((m,mi)=>{
                const a=totAct[mi], b=totBud[mi];
                const isFuture=mi>=ACT_MO;
                return (
                  <td key={m} style={{padding:'8px 4px',textAlign:'center',background:isFuture?`${P.amber}0D`:'transparent',borderLeft:mi===ACT_MO?`2px dashed ${P.amber}44`:'none'}}>
                    <Cell a={a} b={b} mi={mi} bold/>
                  </td>
                );
              })}
              <td style={{padding:'10px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:12.5,fontFamily:"'Playfair Display',serif",borderLeft:`3px solid ${P.amber}55`,background:`${P.amber}12`}}>{fmt(totFYBudget)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{padding:'8px 16px 10px',borderTop:`1px solid ${P.border}`,background:'#FAFAFA'}}>
        <span style={{fontSize:10,color:P.muted}}>Cifra bold = Buget lunar (mereu vizibil, an complet) · sub linie = {mode==='pct'?'abatere % vs realizat':'actual realizat'} · lunile de la {MONTHS[ACT_MO]||'—'} încolo sunt buget planificat (fără actual încă) · click pe o clinică pentru graficul Actual vs Buget</span>
      </div>
    </Card>
  );
}

function AllClinicsTable({period}) {
  // Helper: full year sum for a clinic/year
  const fy = (c, yr) => { const a=c.actuals?.[yr]; if(!a) return null; const v=a.filter(x=>x!=null); return v.length===12?sum(v):null; };
  const rows=Object.values(CD).map(c=>({
    ...c,
    v22:val(c,2022,period), v23:val(c,2023,period),
    v24:val(c,2024,period), v25:val(c,2025,period), v26:val(c,2026,period),
    bv:bval(c,2026,period),
    yoy:gr(val(c,2026,period),val(c,2025,period)),
    vsBgt:gr(val(c,2026,period),bval(c,2026,period)),
    fy2423:gr(fy(c,2024),fy(c,2023)),
    fy2524:gr(fy(c,2025),fy(c,2024)),

  const n26=netv(period), n25=sum(period==='Month'?[NET.actuals[2025][ACT_MO-1]]:period==='YTD'?NET.actuals[2025].slice(0,ACT_MO):NET.actuals[2025].filter(x=>x!==null));
  const n24=sum(period==='Month'?[NET.actuals[2024][ACT_MO-1]]:period==='YTD'?NET.actuals[2024].slice(0,ACT_MO):NET.actuals[2024].filter(x=>x!==null));
  const n23=sum(period==='Month'?[NET.actuals[2023][ACT_MO-1]]:period==='YTD'?NET.actuals[2023].slice(0,ACT_MO):NET.actuals[2023].filter(x=>x!==null));

  const nFY2423=gr(nFY24,nFY23);
  const nFY2524=gr(nFY25,nFY24);
  const lfl26=LFL.reduce((a,c)=>a+(val(CD[c],2026,period)||0),0);
  const lfl25=LFL.reduce((a,c)=>a+(val(CD[c],2025,period)||0),0);

  // Full year LFL YoY
  const lflFY25=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2025]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY24=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2024]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY23=LFL.reduce((a,c)=>{ const v=CD[c].actuals?.[2023]; return a+(v&&v.filter(x=>x!=null).length===12?sum(v.filter(x=>x!=null)):0); },0);
  const lflFY2423=gr(lflFY24,lflFY23);
  const lflFY2524=gr(lflFY25,lflFY24);

  return (
    <div style={{marginBottom:16,background:P.white,border:`1px solid ${P.border}`,borderRadius:12,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>

        </div>
        <div style={{display:'flex',gap:20}}>
          {[['Istoric','#AAA'],['Actuals',P.wheat],['YoY %','#B5BD5C'],['FY YoY','#9B7FCC'],['Budget 2026',P.amber]].map(([l,c])=>(
            <div key={l} style={{display:'flex',alignItems:'center',gap:5}}>

// ─── Pacienți Tab — Marketing & Acquisition | Pacienți ────────────────────────
// Urmează luna selectată din raport (ACT_MO), la fel ca Ops-Med/Ops-Sales. Trei blocuri, în ordinea
// din capitolul sursă: (1) Acquisition & Retention — P0/pacienți lunari/noi, KPI + trend; (2) Canale
// de achiziție — split MTD al lunii curente; (3) Life Time Value per canal — instantaneu static.
// Etichetă cu tooltip la mouse-over (aceeași mecanică vizuală ca IndicatorLabel din Ops-Med — clase
// .da-info/.da-info-tip, definite global) — folosită în tab-ul Pacienți pentru a clarifica diferența
// dintre P0 (înregistrare în sistem) și P1 (vizită efectiv realizată), ca să nu se confunde cele două
// stadii de funnel sau sursele lor de date.
function InfoTip({children,full,calc}) {
  return (
    <span className="da-info" style={{borderBottom:`1px dotted ${P.muted}`,cursor:'help',display:'inline-block'}}>
      {children}
      <span className="da-info-tip" style={{background:P.primary,color:P.white,fontSize:10.5,fontWeight:400,lineHeight:1.4,padding:'8px 11px',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.22)'}}>
        {full && <div style={{fontWeight:700,marginBottom:calc?4:0}}>{full}</div>}
        {calc && <div style={{color:'rgba(255,255,255,0.85)'}}>{calc}</div>}
      </span>
    </span>
  );
}

function ChannelBar({label,value,max,color}) {
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,marginBottom:3}}>
        <span style={{color:P.text,fontWeight:500}}>{label}</span>
        <span style={{color:P.primary,fontWeight:700}}>{value.toFixed(1)}%</span>
      </div>
      <div style={{background:'#F2ECEA',borderRadius:6,height:9,overflow:'hidden'}}>
        <div style={{width:`${Math.max(value/max*100,1.5)}%`,height:'100%',background:color,borderRadius:6}}/>
      </div>
    </div>
  );
}

function FeedbackTab() {
  const i = ACT_MO-1;
  const ei = PATIENTS_OFF+i;
  const dPct = (arr) => i>0 && arr[ei-1] ? Math.round((arr[ei]-arr[ei-1])/arr[ei-1]*100) : null;
  const yoyPct = (arr) => ei-12>=0 && arr[ei-12] ? Math.round((arr[ei]-arr[ei-12])/arr[ei-12]*100) : null;
  const allCodes = C1.concat(C2);
  const fbSumSeries = (codes, table) => PATIENTS_MONTHS_18.map((_,idx)=>{
    const vals = codes.map(c=>table[c]?.[idx]).filter(v=>v!=null);
    return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
  });
  const totalSeries = fbSumSeries(allCodes, FEEDBACK_CLINICS_NO_18);
  const negSeries = fbSumSeries(allCodes, FEEDBACK_CLINICS_NEG_18);
  const totalNow = totalSeries[ei], negNow = negSeries[ei];
  const negPctNow = (totalNow!=null && negNow!=null && totalNow>0) ? Math.round(negNow/totalNow*1000)/10 : null;
  const googleNow = FEEDBACK_GOOGLE_18[ei], googlePctNow = FEEDBACK_GOOGLE_PCT_18[ei];

  const trend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Total feedback':totalSeries[k],'Feedback negativ':negSeries[k],is2025:k<PATIENTS_OFF})).filter(d=>d['Total feedback']!=null);
  const googleTrend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Recenzii Google':FEEDBACK_GOOGLE_18[k],'% către Google':FEEDBACK_GOOGLE_PCT_18[k]}));

  const clinicRows = allCodes.map(code=>{
    const noArr = FEEDBACK_CLINICS_NO_18[code], negArr = FEEDBACK_CLINICS_NEG_18[code];
    const v = noArr[ei], vPrev = ei>0?noArr[ei-1]:null;
    const neg = negArr[ei];
    const negPct = (v!=null && neg!=null && v>0) ? Math.round(neg/v*1000)/10 : null;
    const mom = (v!=null && vPrev!=null && vPrev>=5) ? Math.round((v-vPrev)/vPrev*100) : null;
    return {code, name:MED_CLINIC_NAMES[code], v, neg, mom, negPct};
  });
  const clusterSum = (codes) => {
    const rows = clinicRows.filter(r=>codes.includes(r.code));
    const v = rows.reduce((s,r)=>s+(r.v||0),0), neg = rows.reduce((s,r)=>s+(r.neg||0),0);
    return {v, neg, negPct: v>0 ? Math.round(neg/v*1000)/10 : null};
  };

  const TrendTip = ({active,payload,label}) => {
    if(!active||!payload?.length) return null;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif"}}>
      <div style={{fontWeight:700,marginBottom:5,color:P.primary,fontSize:12,fontFamily:"'Playfair Display',serif"}}>{label}</div>
      {payload.map((p,idx)=>p.value!=null&&<div key={idx} style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}>
        <span style={{color:p.color,fontWeight:500,fontSize:11}}>{p.name}</span><b style={{fontSize:11}}>{p.name.startsWith('%')?p.value+'%':p.value.toLocaleString('en-US')}</b>
      </div>)}
    </div>;
  };

  return <div>
    <div style={{marginBottom:16,background:`linear-gradient(135deg,#FFFFFF 0%,#FBF6F4 100%)`,border:`1px solid ${P.border}`,borderLeft:`3px solid ${P.primary}`,borderRadius:10,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:P.primary,fontFamily:"'Playfair Display',serif"}}>Feedback - QA</div>
        <div style={{fontSize:11,color:P.muted,marginTop:2}}>{MONTHS_FULL[ACT_MO-1]} 2026 · sursă: capitolul lunar "Feedback pacient" (2 slide-uri)</div>
      </div>
      <span style={{background:P.amber,color:P.white,fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:20,letterSpacing:0.4}}>Rețea completă</span>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:16}}>
      <KPI hi label={<InfoTip full="Total feedback — rețea" calc="Suma feedback-urilor (pozitiv + negativ) colectate de toate clinicile în lună, digitizat din tabelul «By Clinic Monthly» al slide-ului «Feedback pacient».">Total feedback (rețea)</InfoTip>} value={totalNow!=null?totalNow.toLocaleString('en-US'):'—'} sub={dPct(totalSeries)!=null?`${dPct(totalSeries)>=0?'▲':'▼'} ${Math.abs(dPct(totalSeries))}% vs ${MONTHS[i-1]}`:'—'} subColor={dPct(totalSeries)!=null?pcol(dPct(totalSeries)):null}/>
      <KPI label={<InfoTip full="% către Google" calc="«My Business» (recenzii Google) / #Positive, digitizat direct din tabelul «Feedback to Google» al slide-ului sursă — NU e recalculat.">% feedback → Google</InfoTip>} value={googlePctNow!=null?`${googlePctNow}%`:'—'} sub={googleNow!=null?`${googleNow.toLocaleString('en-US')} recenzii Google`:'—'}/>
      <KPI label={<InfoTip full="Feedback negativ — rețea" calc="Suma review-urilor negative (0-3 stele) din toate clinicile în lună — puține la număr, de-aceea le vezi și distinct mai jos, per medic și ca mesaje individuale.">Feedback negativ (rețea)</InfoTip>} value={negNow!=null?negNow.toLocaleString('en-US'):'—'} sub={negNow!=null&&negNow>0?`${negPctNow}% din total`:'niciun review negativ'} subColor={negNow>0?P.alert:'#15803D'}/>
      <KPI label="Rata feedback negativ" value={negPctNow!=null?`${negPctNow}%`:'—'} sub="din totalul feedback-ului lunii"/>
    </div>

    <Card style={{marginBottom:16}}>
      <Sec>Feedback total vs. negativ — evoluție lunară</Sec>
      <ResponsiveContainer width="100%" height={210}>
        <ComposedChart data={trend} barCategoryGap="20%">
          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
          <XAxis dataKey="month" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <YAxis yAxisId="left" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <YAxis yAxisId="right" tick={{fontSize:10,fill:P.alert}} axisLine={false} tickLine={false}/>
          <Tooltip content={<TrendTip/>}/>
          <Bar yAxisId="left" dataKey="Total feedback" fill={P.olive} radius={[3,3,0,0]}/>
          <Line yAxisId="right" type="monotone" dataKey="Feedback negativ" stroke={P.alert} strokeWidth={2.5} dot={{r:3.5,fill:P.alert,strokeWidth:0}}/>

      <Legend items={[[P.olive,'Total feedback'],[P.alert,'Feedback negativ',true]]}/>
      <div style={{fontSize:10,color:P.muted,marginTop:8}}>Sursă: slide "Feedback pacient" (1/2), tabel "By Clinic Monthly (YTD)" — sumă pe toate clinicile, digitizat integral din prezentarea de Iulie 2026. Lipsă Aug 25 din fereastra sursă (coloană absentă din tabel, nu valoare zero).</div>

    <Card style={{marginBottom:16}}>

        {[['Cluster 1 · Zona de Sud',C1,P.primary],['Cluster 2 · Buc + Centru',C2,P.olive]].map(([label,codes,color])=>(

              <div style={{fontSize:12.5,fontWeight:700,color:P.white,fontFamily:"'Playfair Display',serif"}}>{label}</div>
            </div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>

                  <InfoTip full="Feedback negativ (0-3 stele)" calc="Numărul de review-uri negative din lună, per clinică. Puține la număr — vezi cardurile de mai jos pentru detalii per medic.">Negativ</InfoTip>
                </th>
                <th style={{padding:'6px 8px',textAlign:'right',fontWeight:600,color:P.muted,borderBottom:`1px solid ${P.border}`}}>% Neg</th>

              <tbody>
                {clinicRows.filter(c=>codes.includes(c.code)).map((c,ri)=>(
                  <tr key={c.code} style={{background:ri%2===0?P.white:'#FAFAFA',borderBottom:'1px solid #F5F5F5'}}>
                    <td style={{padding:'6px 12px',color:P.text}}>{c.name}</td>

                    <td style={{padding:'6px 8px',textAlign:'right',fontWeight:600,color:c.mom!=null?pcol(c.mom):P.muted}}>{c.mom!=null?`${c.mom>=0?'▲':'▼'}${Math.abs(c.mom)}%`:'—'}</td>
                    <td style={{padding:'6px 8px',textAlign:'right',fontWeight:700,color:c.neg>0?P.alert:P.muted,borderLeft:`2px solid ${P.border}`}}>{c.neg!=null?c.neg:'—'}</td>
                    <td style={{padding:'6px 8px',textAlign:'right',fontWeight:600,color:c.negPct>0?P.alert:P.muted}}>{c.negPct!=null?`${c.negPct}%`:'—'}</td>
                  </tr>
                ))}
                {(() => { const s = clusterSum(codes); return (
                  <tr style={{background:'#F3EDEA',borderTop:`2px solid ${P.border}`}}>
                    <td style={{padding:'7px 12px',fontWeight:700,color:P.primary}}>Sumă</td>
                    <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,color:P.primary}}>{s.v.toLocaleString('en-US')}</td>
                    <td style={{padding:'7px 8px',textAlign:'right'}}>—</td>
                    <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,color:s.neg>0?P.alert:P.muted,borderLeft:`2px solid ${P.border}`}}>{s.neg}</td>

                  </tr>
                );})()}

            </table>
          </div>

      </div>
      <div style={{fontSize:10,color:P.muted,marginTop:8}}>Total = #No. feedback (pozitiv + negativ) din tabelul "By Clinic Monthly (YTD)", per clinică. Sumă = totalul cluster-ului (verificat: suma tuturor clinicilor + categoria "Null" = rândul "Grand Total" din slide-ul sursă). Negativ = #Neg din același tabel. Focșani are date doar din Mar 26 (clinică mai nouă). O mică parte din feedback (categoria "Null" din sursă, ~85 în total Iul25-Iul26) nu e atribuită niciunei clinici și nu apare defalcat aici.</div>

      {ACT_MO===7 ? <>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>

            <div key={idx} style={{background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:8,borderLeft:`3px solid ${P.alert}`,padding:'10px 14px'}}>

                <div style={{fontSize:10,color:P.muted}}>{msg.data}</div>
              </div>
              <div style={{fontSize:11.5,color:P.text,lineHeight:1.5,marginBottom:5}}>&ldquo;{msg.mesaj}&rdquo;</div>
              <div style={{fontSize:10,color:P.muted}}>Pacient: {msg.pacient}</div>
            </div>
          ))}

      </> : <div style={{fontSize:11.5,color:P.muted,padding:'20px 0',textAlign:'center'}}>Mesajele individuale sunt digitizate doar pentru Iulie 2026 (luna cea mai recentă) — selectează Iulie din selectorul de perioadă pentru a le vedea. Contorul de feedback negativ per clinică/medic de mai sus e disponibil pentru toate lunile.</div>}
    </Card>
  </div>;
}

function PatientsTab() {
  const i = ACT_MO-1;
  const ei = PATIENTS_OFF+i; // index în array-ul extins (18 luni, Feb25→Iul26)
  const {p0,lunari,noi,noiRatio} = PATIENTS_MONTHLY;
  const [chMode,setChMode] = useState('MTD');
  const ch = (chMode==='MTD'?PATIENTS_CHANNELS:PATIENTS_CHANNELS_YTD)[i];
  const prevOk = i>0;
  const dPct = (arr) => prevOk && arr[ei-1] ? Math.round((arr[ei]-arr[ei-1])/arr[ei-1]*100) : null;
  const yoyOk = ei-12>=0;
  const yoyPct = (arr) => yoyOk && arr[ei-12] ? Math.round((arr[ei]-arr[ei-12])/arr[ei-12]*100) : null;
  const trend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Pacienți lunari':lunari[k],'Pacienți noi':noi[k],'% Noi':noiRatio[k],is2025:k<PATIENTS_OFF}));
  const fbTrend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Leads FB & Insta':PATIENTS_FB_LEADS_18[k],'Conversie':PATIENTS_FB_CONV_18[k]})).filter(d=>d['Leads FB & Insta']!=null);
  const fbLeads = PATIENTS_FB_LEADS_18[ei], fbConv = PATIENTS_FB_CONV_18[ei];
  const fbMom = dPct(PATIENTS_FB_LEADS_18);
  const fbAvail = PATIENTS_FB_LEADS_18.filter(v=>v!=null);
  const fbAvg = fbAvail.length ? Math.round(fbAvail.reduce((a,b)=>a+b,0)/fbAvail.length) : null;
  const FbTip = ({active,payload,label}) => {
    if(!active||!payload?.length) return null;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif"}}>
      <div style={{fontWeight:700,marginBottom:5,color:P.primary,fontSize:12,fontFamily:"'Playfair Display',serif"}}>{label}</div>
      {payload.map((p,idx)=>p.value!=null&&<div key={idx} style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}>
        <span style={{color:p.color,fontWeight:500,fontSize:11}}>{p.name}</span><b style={{fontSize:11}}>{p.name==='Conversie'?p.value+'%':p.value.toLocaleString('en-US')}</b>
      </div>)}
    </div>;
  };
  // Sumă YTD pe seria de 18 luni: anul curent = [PATIENTS_OFF..ei], anul precedent (aceleași luni) =
  // [PATIENTS_OFF-12..ei-12] — clamped la 0, pentru că Ian 25 nu apare în nicio prezentare (fereastra
  // 2025 disponibilă începe la Feb 25).
  const p0YtdYoy = (arr) => {
    const {ytd26, ytd25} = p0YtdPair(arr, ei);
    return (ytd26!=null&&ytd25!=null&&ytd25>=10) ? Math.round((ytd26-ytd25)/ytd25*100) : null;
  };
  const p0Row = (label, arr, isTotal) => {
    const m = p0Metrics(arr, ei);
    return {code:label, name:label, isTotal, ...m, ytdYoy:p0YtdYoy(arr)};
  };
  const p0Clinics = C1.concat(C2).map(code=>({
    ...p0Row(code, PATIENTS_P0_CLINICS_18[code], false),
    code, name:MED_CLINIC_NAMES[code],
  }));
  const p0ClusterTotal = (codes) => p0Row('Total', p0ClusterSeries(codes), true);
  const p0ClusterSum = (codes) => p0Row('Sumă', p0SumSeries(codes), true);
  const p0GrandTotal = p0ClusterTotal(C1.concat(C2));
  const p0GrandSum = p0ClusterSum(C1.concat(C2));
  const TrendTip = ({active,payload,label}) => {
    if(!active||!payload?.length) return null;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif"}}>
      <div style={{fontWeight:700,marginBottom:5,color:P.primary,fontSize:12,fontFamily:"'Playfair Display',serif"}}>{label}</div>
      {payload.map((p,idx)=>p.value!=null&&<div key={idx} style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}>
        <span style={{color:p.color,fontWeight:500,fontSize:11}}>{p.name}</span><b style={{fontSize:11}}>{p.name==='% Noi'?p.value+'%':p.value.toLocaleString('en-US')}</b>
      </div>)}
    </div>;
  };
  const maxCh = Math.max(ch.fb,ch.ff);
  const kpiSub = (arr) => {
    const y = yoyPct(arr);
    if(y!=null) return `${y>=0?'▲':'▼'} ${Math.abs(y)}% YoY (${PATIENTS_MONTHS_18[ei-12]})`;
    const d = dPct(arr);
    if(d!=null) return `${d>=0?'▲':'▼'} ${Math.abs(d)}% vs ${MONTHS[i-1]}`;
    return '—';
  };
  const kpiCol = (arr) => yoyPct(arr)!=null?pcol(yoyPct(arr)):dPct(arr)!=null?pcol(dPct(arr)):null;

  return <div>
    <div style={{marginBottom:16,background:`linear-gradient(135deg,#FFFFFF 0%,#FBF6F4 100%)`,border:`1px solid ${P.border}`,borderLeft:`3px solid ${P.primary}`,borderRadius:10,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:P.primary,fontFamily:"'Playfair Display',serif"}}>Pacienți — Marketing &amp; Acquisition</div>
        <div style={{fontSize:10.5,color:P.muted,marginTop:2}}>{MONTHS_FULL[ACT_MO-1]} 2026 · sursă: capitolul lunar "Marketing &amp; Acquisition | Pacienți"</div>
      </div>
      <span style={{background:P.amber,color:P.white,fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:20,letterSpacing:0.4}}>Rețea completă</span>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:16}}>
      <KPI hi label={<InfoTip full="Rata de Atragere a Pacienților Noi — rețea" calc="P0 (pacienți înregistrați în sistem, suma pe rețea) / Pacienți Unici, digitizat direct din tabelul New_ratio. NU se confundă cu P1 (pacientul care a și efectuat prima vizită) — acela nu are total de rețea disponibil, doar per clinică (MED_KPI).">Rata de Atragere a Pacienților Noi</InfoTip>} value={noiRatio[ei]+'%'} sub={`${(100-noiRatio[ei])}% recurenți`}/>
      <KPI label={<InfoTip full="Pacienți Înregistrați (P0) — total rețea" calc="Suma P0 (pacienți înregistrați în sistem) pe toată rețeaua, luna curentă — digitizat din tabelul New_ratio (rândul «Pacienți noi»), care e aceeași metrică cu suma P0-urilor per clinică din tabelul de mai jos (mici diferențe de rotunjire între cele două sursă/slide-uri). NU e P1 (pacientul care a și efectuat prima vizită) — acela e digitizat doar per clinică (MED_KPI), fără total de rețea în prezentări.">Pacienți Înregistrați (P0)</InfoTip>} value={noi[ei].toLocaleString('en-US')} sub={kpiSub(noi)} subColor={kpiCol(noi)}/>
      <KPI label={<InfoTip full="Pacienți Unici — total rețea" calc="Pacienți DISTINCȚI cu ≥1 vizită în lună, la nivel de rețea (tabel New_ratio). Stadiul funnel-ului dintre Vizite și P0: VIZITE ≥ PACIENȚI UNICI ≈ P0 → P1 → P2 → Inactiv. Nu e totuna cu «Vizite» (MED_KPI, un pacient poate avea mai multe vizite/lună) și nici cu P0 (înregistrare în sistem, tabelul per-clinică de mai jos) — vezi tab-ul pentru detalii funnel complet.">Pacienți Unici (lunari)</InfoTip>} value={lunari[ei].toLocaleString('en-US')} sub={kpiSub(lunari)} subColor={kpiCol(lunari)}/>
    </div>

    <Card style={{marginBottom:16}}>

        <ComposedChart data={trend} barCategoryGap="20%">
          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
          <XAxis dataKey="month" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <YAxis yAxisId="left" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <YAxis yAxisId="right" orientation="right" domain={[0,100]} tickFormatter={v=>v+'%'} tick={{fontSize:10,fill:P.amber}} axisLine={false} tickLine={false}/>
          <Tooltip content={<TrendTip/>}/>
          <ReferenceLine x="Ian" yAxisId="left" stroke={P.border} strokeDasharray="3 3"/>
          <Bar yAxisId="left" dataKey="Pacienți lunari" radius={[3,3,0,0]}>
            {trend.map((d,idx)=><Cell key={idx} fill={d.is2025?'#F2ECE6':'#E8D9CD'}/>)}
          </Bar>
          <Bar yAxisId="left" dataKey="Pacienți noi" radius={[3,3,0,0]}>
            {trend.map((d,idx)=><Cell key={idx} fill={d.is2025?`${P.primary}66`:P.primary}/>)}

          <Line yAxisId="right" type="monotone" dataKey="% Noi" stroke={P.amber} strokeWidth={2.5} dot={{r:3.5,fill:P.amber,strokeWidth:0}}/>
        </ComposedChart>
      </ResponsiveContainer>
      <Legend items={[['#E8D9CD','Pacienți lunari'],[P.primary,'Pacienți noi'],[P.amber,'% Noi din total',true]]}/>
      <div style={{fontSize:10,color:P.muted,marginTop:8}}>Segmentele mai clare (Feb–Dec 25) marchează anul precedent — linia verticală separă 2025 de 2026. Sursă: "New_ratio (YTD)" — combinat din fereastra glisantă a prezentărilor de Ianuarie (Feb25→Ian26) și Iulie (Iul25→Iul26). Ianuarie 25 nu apare în nicio prezentare din folder, de-aceea Ianuarie 26 e singura lună fără comparație YoY.</div>

const IND_TIP = {

  "Productivitate/tură": {full:"Rata de productivitate pe tura medicala", calc:"Încasări / Ture realizate."},
  "Productivitate/pacient": {full:"Rata de productivitate / încasări per pacient", calc:"Încasări / Pacienți (vizite)."},
  "Pacienți înregistrați": {full:"Pacienți înregistrați în sistem"},
  "Ture realizate": {full:"Rata de Realizare a turelor medicale", calc:"Ture lucrate / Ture planificate."},
  "Achizitie pacienti": {full:"Achiziție pacienți", calc:"Pacienți înregistrați / Pacienți (vizite) — valoare digitizată din slide."},
  "Retentie Efectiva": {full:"Rata de Retenție Medicală efectivă la P2 (din pacienții noi)", calc:"P2 - pacienți activi / P1 - pacienți noi. P2 efectiv = pacientul a venit confirmat în clinică în lună."},
  "Plan tratament": {full:"Rata de realizare a planurilor de tratament raportata la P1", calc:"Plan de tratament (etapizat) / P1 - pacienți noi. Obiectiv medical: cel mai târziu la P2, toți pacienții să aibă un plan de tratament etapizat prezentat și discutat cu ei."},
  "RX": {full:"Rata de Efectuare a RX la P1", calc:"RX / P1 - pacienți noi. Obiectiv: toți pacienții noi de la P1 să aibă radiografii (cu excepții — copii, cei cu RX deja efectuat la alte clinici etc.)."},
  "P2 activi efectivi": {full:"P2 - pacienți activi efectivi"},
  "Upsell efectivi": {full:"P2 - upsell efectivi"},
  "P2 activi potențiali": {full:"P2 - pacienți activi potențiali"},
  "Upsell potențiali": {full:"P2 - upsell potențiali"},
  "Pacienti (vizite)": {full:"Pacienți (vizite)"},
  "Achiziție pacienți": {full:"Rata de achiziție a pacienților noi", calc:"Pacienți înregistrați / Pacienți (vizite) — valoare digitizată din slide (nu recalcul live, ca să păstreze media Y-1/YTD corectă)."},
  "Anulate/nepr. (rată)": {full:"Anulate / neprezentări (rată)", calc:"Anulate / nepr. / Programări totale."},
  "Reprogramări (din anulate)": {full:"Reprogramări din anulate / neprezentări"},
  "Reprogramari": {calc:"Reprogramări (din anulate) / Anulate / nepr."},
  "Feedback QA": {full:"Feedback pacient - QA", calc:"Feedback pozitiv / Feedback total."},
  "Feedback Negativ": {calc:"Feedback total − Feedback pozitiv."},
  "Retentie recall": {full:"Retenție recall", calc:"Programați (Recall) / Recall (total)."},
  "Conversie Leads": {calc:"Programați (Lead-uri) / Lead-uri."},
  "Retentie Birthday": {full:"Retenție Birthday", calc:"Programați Birthday / Birthday (total)."},
  "Acord date": {full:"Acord prelucrare date"},
  "Olograf/Digital": {full:"Speciale Olograf/Digital"},
  "Programări pierdute": {calc:"Rând brut: Anulate/nepr. − Reprogramări (din anulate). Rând-rată: Programări pierdute / Programări totale."},
};

// Tooltip-uri specifice secțiunii "KPI Generaliști" — prin paralelism cu IND_TIP (KPI Clinică), dar
// menționând explicit că indicatorul e calculat pentru medicii de stomatologie generală. Au prioritate
// peste IND_TIP (vezi `override` din IndicatorLabel) pentru etichetele partajate între cele două tabele.
const GEN_TIP_OVERRIDES = {
  "Ture realizate": {full:"Rata de Realizare a turelor medicale", calc:"Ture lucrate / Ture planificate. Reprezintă rata de realizare a turelor de către medicii de stomatologie generală."},
  "Productivitate/tură": {full:"Rata de productivitate pe tura medicală", calc:"Încasări / Ture realizate. Calculată pentru medicii de stomatologie generală."},
  "Productivitate/pacient": {full:"Rata de productivitate / încasări per pacient", calc:"Încasări / Pacienți (vizite). Calculată pentru medicii de stomatologie generală."},
  "Retentie Efectiva": {full:"Rata de Retenție Medicală efectivă la P2", calc:"(P2 activi + Upsell, efectivi) / P1 - pacienți noi. P2 efectiv = pacientul a venit confirmat în clinică în lună, la medicul generalist."},
  "Retentie potentiala": {full:"Rata de Retenție Medicală potențială la P2", calc:"(P2 activi + Upsell, potențiali) / P1 - pacienți noi. P2 potențial = programarea e în calendar, dar nu e confirmat că pacientul a și venit efectiv în clinică în lună. Indicator intern, cerut de medici — nu se urmărește în sesiunile de Sales."},
  "Plan tratament": {full:"Rata de realizare a planurilor de tratament raportata la P1", calc:"Plan de tratament (etapizat) / P1 - pacienți noi. Obiectiv medical: cel mai târziu la P2, toți pacienții să aibă un plan de tratament etapizat prezentat și discutat, la medicul generalist."},
  "RX": {full:"Rata de Efectuare a RX la P1", calc:"RX / P1 - pacienți noi. Obiectiv: toți pacienții noi de la P1 să aibă radiografii la medicul generalist (cu excepții — copii, cei cu RX deja efectuat la alte clinici etc.)."},
};

// Etichetă cu tooltip la mouse-over: titlul complet (dacă diferă de cel scurt afișat) + explicația
// de calcul, pentru rândurile din IND_TIP. Restul rândurilor rămân text simplu, fără hover.
// `suppress` = true pentru rândul brut (D) când există și un rând-rată (%) cu aceeași etichetă în
// tabel (ex. "Plan tratament") — tooltip-ul apare doar pe linia de %, nu și pe cea cu date absolute.
// `override` = tooltip specific secțiunii curente (ex. "Ture realizate" înseamnă altceva la
// KPI Generaliști vs KPI Clinică), are prioritate peste IND_TIP.
function IndicatorLabel({label,fs,suppress,override}) {
  const tip = !suppress && (override || IND_TIP[label]);
  if(!tip) return <span style={{color:P.text,fontSize:fs,fontWeight:400,lineHeight:1.25,whiteSpace:'nowrap'}}>{label}</span>;
  return (
    <span className="da-info" style={{color:P.text,fontSize:fs,fontWeight:400,lineHeight:1.25,whiteSpace:'nowrap',borderBottom:`1px dotted ${P.muted}`,cursor:'help'}}>
      {label}
      <span className="da-info-tip" style={{background:P.primary,color:P.white,fontSize:10.5,fontWeight:400,lineHeight:1.4,padding:'8px 11px',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.22)'}}>
        {tip.full && <div style={{fontWeight:700,marginBottom:tip.calc?4:0}}>{tip.full}</div>}
        {tip.calc && <div style={{color:'rgba(255,255,255,0.85)'}}>{tip.calc}</div>}
      </span>
    </span>
  );
}

// ─── Ops-Med Tab — Indicatori de performanță Medical, per clinică ─────────────
// Urmează luna selectată în raport (ACT_MO), la fel ca restul tab-urilor — nu are picker propriu.
// Un tabel per cluster: rândul de agregat (Y-1 AVG / YTD AVG / MTD) urmat de clinicile din cluster —
// exact structura slide-ului sursă, cu bugetul de citire concentrat într-un singur tabel per cluster.
function MedClusterTable({clusterLabel,clusterNote,color,rows,aggRows,clinicCodes,clinicRows,outliers,compact,hiddenRows,groupToggle,openGroupRows,tipOverrides}) {
  const hasYtd = aggRows.some(r=>r && r[1]!=null);
  const sub = hasYtd ? ['Y-1 AVG','YTD AVG','MTD'] : ['Y-1 AVG','MTD'];
  const idx = hasYtd ? [0,1,2] : [0,2];
  const fs = compact ? 10 : 10.5;
  const indPad = compact ? '5px 10px' : '6px 14px';
  const cellPad = compact ? '5px 6px' : '6px 8px';
  // Etichete care au un rând-rată (%) în acest tabel — pentru acestea, tooltip-ul se arată doar pe
  // linia de % (vezi IndicatorLabel `suppress`), nu și pe linia cu date absolute (D) cu aceeași etichetă.
  const pctLabels = new Set(rows.filter(([lbl,,pf])=>pf!==undefined?pf:lbl.startsWith('%')).map(([lbl])=>lbl));
  return (
    <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:12,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.06)',flex:1,minWidth:0}}>
      <div style={{background:color,padding:'12px 18px'}}>
        <div style={{fontSize:13,fontWeight:700,color:P.white,fontFamily:"'Playfair Display',serif",letterSpacing:0.3}}>{clusterLabel}</div>
        <div style={{fontSize:9.5,color:'rgba(255,255,255,0.6)',marginTop:1}}>{clusterNote}</div>
      </div>
      <div style={{overflowX:compact?'visible':'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:fs,tableLayout:compact?'fixed':'auto'}}>
          <thead>
            <tr style={{background:'#F8F4F4'}}>
              <th style={{padding:compact?'6px 10px':'8px 14px',textAlign:'left',fontWeight:700,color:P.primary,fontSize:fs,borderBottom:`1px solid ${P.border}`,minWidth:compact?0:150,width:compact?'27%':'auto',whiteSpace:compact?'normal':'nowrap'}}>Indicator</th>
              {sub.map((s,i)=>{
                const sp = s.indexOf(' ');
                return (
                <th key={s} style={{padding:compact?'6px 4px':'8px 8px',textAlign:'right',fontWeight:700,color,fontSize:compact?9:9.5,borderBottom:`1px solid ${P.border}`,background:`${color}0C`,borderLeft:i===0?`3px solid ${color}44`:'none',whiteSpace:'normal'}}>
                  {sp<0 ? s : <React.Fragment>{s.slice(0,sp)}<br/>{s.slice(sp+1)}</React.Fragment>}
                </th>
              )})}
              {clinicCodes.map((c,i)=>(
                <th key={c} style={{padding:compact?'6px 4px':'8px 8px',textAlign:'right',fontWeight:600,color:P.muted,fontSize:compact?9:9.5,borderBottom:`1px solid ${P.border}`,borderLeft:i===0?`3px solid ${P.border}`:'none'}}>{MED_CLINIC_NAMES[c]}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((row,ri)=>{
              if(hiddenRows && hiddenRows.has(ri)) return null;
              const [label,type,pctFlag]=row;
              const isPct=pctFlag!==undefined?pctFlag:label.startsWith('%');
              const fmtv = v => v==null ? '—' : isPct ? v+'%' : v.toLocaleString('en-US');
              const agg=aggRows[ri]||[];
              const out=isPct?outliers?.[ri]:null;
              const inOpenGroup = openGroupRows?.has(ri);
              const rowBg = inOpenGroup ? '#FBF3E4' : (ri%2===0?P.white:'#FAFAFA');
              const toggle = groupToggle?.[ri];
              return (
              <tr key={ri} style={{borderBottom:`1px solid #F5F5F5`,background:rowBg}}
                onMouseEnter={e=>e.currentTarget.style.background=inOpenGroup?'#F7EAD2':'#FDF5F5'}
                onMouseLeave={e=>e.currentTarget.style.background=rowBg}>
                <td style={{padding:indPad,display:'flex',alignItems:'center',gap:6,whiteSpace:compact?'normal':'nowrap',borderLeft:inOpenGroup?`3px solid ${P.amber}66`:'3px solid transparent'}}>
                  <span style={{width:6,height:6,borderRadius:3,background:inOpenGroup?P.amber:P.olive,flexShrink:0}}/>
                  <IndicatorLabel label={label} fs={fs} suppress={!isPct && pctLabels.has(label)} override={tipOverrides?.[label]}/>
                  {toggle && (
                    <button onClick={()=>toggle.onToggle()} title={toggle.open?'Restrânge grupul':`Arată ${toggle.count} indicatori ascunși`} style={{
                      marginLeft:'auto',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',gap:2,
                      background:toggle.open?'#F0F0F0':`${P.amber}18`,border:`1px solid ${toggle.open?P.border:P.amber+'55'}`,
                      borderRadius:10,width:22,height:16,fontSize:8.5,fontWeight:700,color:toggle.open?P.muted:'#8A6200',cursor:'pointer',padding:0,
                    }}>
                      {!toggle.open && toggle.count}
                      <span style={{display:'inline-block',transform:toggle.open?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.15s',fontSize:8,lineHeight:1}}>▸</span>
                    </button>
                  )}
                </td>
                {idx.map((vi,i)=>(
                  <td key={'a'+i} style={{padding:cellPad,textAlign:'right',fontSize:fs,fontWeight:600,color:P.muted,borderLeft:i===0?`3px solid ${color}22`:'none'}}>{fmtv(agg[vi])}</td>
                ))}
                {clinicCodes.map((c,ci)=>{
                  const v=clinicRows[ri]?.[ci];
                  const isMax = out && v!=null && v===out.max;
                  const isMin = out && v!=null && v===out.min;
                  // implicit: mai mare = mai bine (amber=cel mai mare, roșu=cel mai mic)
                  // invert: mai mare = mai rău (roșu=cel mai mare, verde=cel mai mic)
                  const maxStyle = out?.invert ? {c:'#B91C1C',bg:'#FEE2E2'} : {c:'#92400E',bg:'#FEF3C7'};
                  const minStyle = out?.invert ? {c:'#15803D',bg:'#DCFCE7'} : {c:'#B91C1C',bg:'#FEE2E2'};
                  return (
                    <td key={c} style={{padding:compact?'5px 4px':'5px 7px',textAlign:'right',borderLeft:ci===0?`3px solid ${P.border}`:'none'}}>
                      <span style={{
                        display:'inline-block',padding:isMax||isMin?'2px 6px':0,borderRadius:20,
                        fontSize:isMax||isMin?(compact?11:11.5):fs,fontWeight:700,
                        color:isMax?maxStyle.c:isMin?minStyle.c:P.text,
                        background:isMax?maxStyle.bg:isMin?minStyle.bg:'transparent',
                      }}>{fmtv(v)}</span>
                    </td>
                  );
                })}
              </tr>
            )})}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// Cele două clustere afișate unul lângă altul, pentru comparație directă rând-cu-rând.
// Rândurile de tip % sunt evidențiate (fond albastru) — acolo se face analiza — iar cea mai
// mare / mică valoare per rând (across ambele clustere) e marcată drept outlier (amber/roșu).
// Banner de secțiune — vizibil intenționat cât headerul de cluster, ca să separe clar secțiunile.
function SectionBanner({title,note}) {
  return (
    <div style={{
      background:`linear-gradient(90deg, ${P.amber}22 0%, ${P.amber}06 100%)`,borderLeft:`4px solid ${P.amber}`,
      borderRadius:8,padding:'11px 16px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between',
      flexWrap:'wrap',gap:8,
    }}>
      <div>
        <div style={{fontSize:15,fontWeight:800,color:P.primary,fontFamily:"'Playfair Display',serif",letterSpacing:0.2}}>{title}</div>
        {note && <div style={{fontSize:10,color:P.muted,marginTop:2}}>{note}</div>}
      </div>
    </div>
  );
}

function MedIndicatorSection({title,note,rows,agg,c1codes,c2codes,groups,invertRows,compact,tipOverrides}) {
  const [openGroups,setOpenGroups] = useState(()=>new Set());
  // Outlier-ii se calculează separat per cluster (nu across ambele) — fiecare tabel își semnalează
  // propriul cel mai mare/mic, indiferent de valorile celuilalt cluster.
  const outliersFor = (clinicRows) => rows.map((row,ri)=>{
    const [label,type,pctFlag]=row;
    const isPct=pctFlag!==undefined?pctFlag:label.startsWith('%');
    if(!isPct) return null;
    const vals=(clinicRows[ri]||[]).filter(v=>v!=null);
    if(vals.length<2) return null;
    const max=Math.max(...vals), min=Math.min(...vals);
    return max===min ? null : {max,min,invert:invertRows?.has(ri)};
  });
  const outliersC1 = outliersFor(agg.rowsC1);
  const outliersC2 = outliersFor(agg.rowsC2);
  const hiddenRows = new Set();
  const openGroupRows = new Set();
  const groupToggle = {};
  (groups||[]).forEach(g=>{
    const isOpen = openGroups.has(g.id);
    if(!isOpen) g.hideIndices.forEach(i=>hiddenRows.add(i));
    else g.hideIndices.forEach(i=>openGroupRows.add(i));
    groupToggle[g.anchorIndex] = {
      open:isOpen, count:g.hideIndices.length,
      onToggle:()=>setOpenGroups(prev=>{ const next=new Set(prev); next.has(g.id)?next.delete(g.id):next.add(g.id); return next; }),
    };
  });
  const hasInvert = invertRows && invertRows.size>0;
  return (
    <div style={{marginBottom:18}}>
      <SectionBanner title={title} note={note||"Y-1 AVG = medie an trecut · YTD AVG = medie de la începutul anului · MTD = luna curentă"}/>
      <div style={{display:'flex',gap:14,flexWrap:'wrap'}}>
        <MedClusterTable clusterLabel="Cluster 1 · Zona de Sud" clusterNote="Oltenița · Giurgiu · Slobozia · Călărași" color={P.primary}
          rows={rows} aggRows={agg.c1} clinicCodes={c1codes} clinicRows={agg.rowsC1} outliers={outliersC1} hiddenRows={hiddenRows} groupToggle={groupToggle} openGroupRows={openGroupRows} compact={compact} tipOverrides={tipOverrides}/>
        <MedClusterTable clusterLabel="Cluster 2 · Buc + Centru" clusterNote="Dorobanți · Cotroceni · Târgoviște · Focșani" color={P.olive}
          rows={rows} aggRows={agg.c2} clinicCodes={c2codes} clinicRows={agg.rowsC2} outliers={outliersC2} hiddenRows={hiddenRows} groupToggle={groupToggle} openGroupRows={openGroupRows} compact={compact} tipOverrides={tipOverrides}/>
      </div>
      <div style={{display:'flex',gap:16,flexWrap:'wrap',marginTop:8,padding:'6px 2px'}}>
        {hasInvert ? <React.Fragment>
          <span style={{fontSize:9.5,color:P.muted,display:'flex',alignItems:'center',gap:5}}><span style={{padding:'1px 6px',borderRadius:10,background:'#FEE2E2',color:'#B91C1C',fontWeight:800,fontSize:9.5}}>val</span>cea mai mare valoare (nefavorabil)</span>
          <span style={{fontSize:9.5,color:P.muted,display:'flex',alignItems:'center',gap:5}}><span style={{padding:'1px 6px',borderRadius:10,background:'#DCFCE7',color:'#15803D',fontWeight:800,fontSize:9.5}}>val</span>cea mai mică valoare (favorabil)</span>
        </React.Fragment> : <React.Fragment>
          <span style={{fontSize:9.5,color:P.muted,display:'flex',alignItems:'center',gap:5}}><span style={{padding:'1px 6px',borderRadius:10,background:'#FEF3C7',color:'#92400E',fontWeight:800,fontSize:9.5}}>val</span>cea mai mare valoare din rând (în cadrul clusterului)</span>
          <span style={{fontSize:9.5,color:P.muted,display:'flex',alignItems:'center',gap:5}}><span style={{padding:'1px 6px',borderRadius:10,background:'#FEE2E2',color:'#B91C1C',fontWeight:800,fontSize:9.5}}>val</span>cea mai mică valoare din rând (în cadrul clusterului)</span>
        </React.Fragment>}
        {groups && groups.length>0 && <span style={{fontSize:9.5,color:P.muted,display:'flex',alignItems:'center',gap:5}}><span style={{width:11,height:11,borderRadius:3,background:'#FBF3E4',border:`1px solid ${P.amber}66`,display:'inline-block'}}/>rânduri desfăcute dintr-un grup colapsat</span>}
      </div>
    </div>
  );
}

// Notă de subsol la "KPI Generaliști" — indicator intern cerut de medici (Retenție potențială la P2),
// nu urmărit în sesiunile de Sales. Colapsată implicit, accesibilă printr-un buton discret.
function GenPotentialaNote({rows,agg,c1codes,c2codes,group}) {
  const [open,setOpen] = useState(false);
  return (
    <div style={{marginTop:-4,marginBottom:18}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        display:'flex',alignItems:'center',gap:6,background:'none',border:'none',padding:'4px 2px',
        fontSize:11,color:P.muted,cursor:'pointer',fontStyle:'italic',
      }}>
        <span style={{display:'inline-block',transform:open?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.15s',fontSize:9}}>▸</span>
        Notă (medici): Retenție potențială la P2 — indicator intern, neurmărit în Sales
      </button>
      {open && (
        <div style={{marginTop:6,padding:'12px 14px',background:'#FBF3E4',border:`1px dashed ${P.amber}88`,borderRadius:10}}>
          <div style={{fontSize:10,color:P.muted,marginBottom:10}}>
            P2 potențial = programarea e în calendar, dar nu e confirmat că pacientul a și venit efectiv în clinică în lună. Cerut explicit de medici, ca reper intern.
          </div>
          <MedIndicatorSection title="Retenție potențială la P2" rows={rows} agg={agg} c1codes={c1codes} c2codes={c2codes} groups={[group]} compact/>
