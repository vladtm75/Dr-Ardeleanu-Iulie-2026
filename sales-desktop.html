// Sumă (nu medie) a P0-urilor clinicilor disponibile din cluster/rețea, per lună — folosită separat
// de rândul "Total" (medie) din slide-ul sursă, pentru un rând "Sumă" adițional cerut explicit
// (volumul real de pacienți înregistrați, nu media per clinică).
const p0SumSeries = (codes) => PATIENTS_MONTHS_18.map((_,idx)=>{
  const vals = codes.map(c=>PATIENTS_P0_CLINICS_18[c]?.[idx]).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
});
// Medie ultimele 12 luni (inclusiv luna curentă `ei`), ignorând lunile fără dată — sub 6 luni cu dată
// disponibilă considerăm media nesemnificativă (`null`), pentru a nu induce în eroare.
const p0Avg12 = (arr, ei) => {
  const vals = (arr||[]).slice(Math.max(0,ei-11), ei+1).filter(v=>v!=null);
  return vals.length>=6 ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
};
// Metrici standard (valoare curentă, MoM, YoY, medie 12 luni + abaterea de la ea) pentru o serie de
// 18 luni (per clinică sau agregat cluster/rețea) — folosit unificat în tab-urile Pacienți/Cluster/Clinică.
const p0Metrics = (arr, ei) => {
  const v = arr?.[ei], vPrev = ei>0 ? arr?.[ei-1] : null, vYoy = ei>=12 ? arr?.[ei-12] : null;
  const avg12 = p0Avg12(arr, ei);
  return {
    v,
    mom: (v!=null && vPrev!=null && vPrev>=10) ? Math.round((v-vPrev)/vPrev*100) : null,
    yoy: (v!=null && vYoy!=null && vYoy>=10) ? Math.round((v-vYoy)/vYoy*100) : null,
    avg12,
    vsAvg12: (v!=null && avg12!=null && avg12>=10) ? Math.round((v-avg12)/avg12*100) : null,
  };
};

// Sumă cumulată pe intervalul [fromIdx,toIdx] (indecși în seria de 18 luni), ignorând lunile fără
// dată digitizată (null) — folosit pentru YTD-urile de Pacienți (P0) în tab-urile Pacienți/Cluster/Clinică.
const p0YtdSum = (arr,fromIdx,toIdx) => {
  if(toIdx<fromIdx) return null;
  const vals = (arr||[]).slice(Math.max(0,fromIdx),toIdx+1).filter(v=>v!=null);
  return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
};
// YTD 26 vs YTD 25 pe FERESTRE EGALE — Ian 25 nu există în nicio prezentare (index -1, structural
// inexistent), deci un YTD "clasic" Ian26→lună curentă (N luni) comparat cu Ian25→lună curentă (N-1
// luni, din cauza lacunei) ar infla artificial creșterea (compară mai multe luni din 2026 cu mai puține
// din 2025). Corect: aliniem AMBELE ferestre la aceeași lungime (numărul de luni efectiv disponibile în
// 2025, terminând în luna curentă), sacrificând Ianuarie din fereastra 2026 dacă e nevoie. Bug prins de
// utilizator ("arată prea bine") — YTD YoY era sistematic supraestimat înainte de acest fix.
const p0YtdPair = (arr, ei) => {
  const from25raw = PATIENTS_OFF-12, to25 = ei-12;
  const from25 = Math.max(0, from25raw);
  const months = to25 - from25 + 1;
  if(months<=0) return {ytd26:null, ytd25:null};
  const from26 = ei - months + 1;
  return {ytd26: p0YtdSum(arr, from26, ei), ytd25: p0YtdSum(arr, from25, to25)};
};

// Helpers — period total per category
const CIDX = () => 11 + ACT_MO;   // indexul lunii selectate in CAT_MONTHS (Ian 26 = 12)
const catVal = (key, period) => {
  const a = CAT_DATA[key], ci = CIDX();
  if (period === 'Month') return a[ci];
  let s = 0; for (let i = 12; i <= ci; i++) s += a[i]; return s;   // YTD Ian - luna selectata
};
const catYoY = (key) => { const a = CAT_DATA[key], ci = CIDX(); return ci >= 12 ? gr(a[ci], a[ci-12]) : null; };
// Mix share (% of total network) at a given month index
const catShare = (key, monthIdx) => {
  const monthTotal = CAT_LIST.reduce((s,c) => s + CAT_DATA[c.key][monthIdx], 0);
  return monthTotal ? CAT_DATA[key][monthIdx] / monthTotal * 100 : 0;
};
// Δ pondere YoY (Apr 26 share − Apr 25 share, in percentage points)
const catSumRange = (key, a0, a1) => { const a = CAT_DATA[key]; let s = 0; for (let i = a0; i <= a1; i++) s += (a[i] || 0); return s; };
const catShareYTD = (key, y26) => { const ci = CIDX(); const a0 = y26 ? 12 : 0, a1 = y26 ? ci : ci - 12; const tot = CAT_LIST.reduce((s, c) => s + catSumRange(c.key, a0, a1), 0); return tot ? catSumRange(key, a0, a1) / tot * 100 : 0; };
const catShareDeltaYoY = (key, period) => period === 'YTD' ? catShareYTD(key, true) - catShareYTD(key, false) : catShare(key, CIDX()) - catShare(key, CIDX() - 12);

// ─── Helpers ──────────────────────────────────────────────────────────────────
const sum  = (arr) => (arr||[]).reduce((a,b)=>a+(b||0),0);
const ytd  = (arr,n) => sum((arr||[]).slice(0,n));
const gr   = (a,b) => (b&&b!==0) ? ((a-b)/b)*100 : null;
const fmt  = (v) => {
  if(v==null||isNaN(v)) return '—';
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(2)+'M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(0)+'K';
  return v.toFixed(0);
};
const pct  = (v) => v==null ? '—' : (v>0?'+':'')+v.toFixed(1)+'%';
const pct0 = (v) => v==null ? '—' : (v>0?'+':'')+Math.round(v)+'%';
const pcol = (v) => v==null ? P.muted : v>=10 ? '#2D7D46' : v>=0 ? '#5A9E6B' : P.alert;

const val = (clinic, yr, period) => {
  const a = clinic.actuals?.[yr]; if(!a) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='YTD') {
    const slice = a.slice(0, ACT_MO);
    if (slice.every(x=>x==null)) return null;
    return slice.reduce((s,v)=>s+(v||0),0);
  }
  const nonNull = a.filter(x=>x!==null);
  return nonNull.length ? sum(nonNull) : null;
};
const bval = (clinic, yr, period) => {
  const a = clinic.budget?.[yr]; if(!a||a.every(x=>x==null)) return null;
  if (period==='Month') return a[ACT_MO-1];
  if (period==='Annual') return sum(a.filter(x=>x!==null));
  return ytd(a, ACT_MO);
};
const netv = (period) => {
  const a=NET.actuals[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a.filter(x=>x!==null));
};
const netb = (period) => {
  const a=NET.budget[2026];
  return period==='Month'?a[ACT_MO-1]:period==='YTD'?ytd(a,ACT_MO):sum(a);
};
const pLabel = (p) => p==='Month'?MONTHS[ACT_MO-1]+' 2026':p==='YTD'?'YTD Ian–'+MONTHS[ACT_MO-1]+' 2026':'Full Year';

const KPI = ({label,value,sub,subColor,sub2,sub2Color,hi,delta}) => {
  const deltaPos = delta === true;
  const deltaNeg = delta === false;
  const deltaBg = deltaPos ? 'rgba(21,128,61,0.05)' : deltaNeg ? 'rgba(217,48,37,0.05)' : null;
  const deltaBorder = deltaPos ? '#15803D' : deltaNeg ? P.alert : null;
  return (
  <div style={{
    background: hi ? P.primary : deltaBg || P.white,
    border: `1px solid ${hi ? P.primary : deltaBorder || P.border}`,
    borderLeft: deltaBorder ? `3px solid ${deltaBorder}` : undefined,
    borderRadius: 10, padding: '15px 17px',
    boxShadow: hi ? '0 2px 10px rgba(123,28,22,0.18)' : deltaPos ? '0 1px 6px rgba(21,128,61,0.10)' : deltaNeg ? '0 1px 6px rgba(217,48,37,0.10)' : '0 1px 3px rgba(0,0,0,0.04)',
  }}>
    <div style={{fontSize:10,fontWeight:600,color:hi?'rgba(255,255,255,0.65)':P.muted,textTransform:'uppercase',letterSpacing:0.7,marginBottom:5}}>{label}</div>
    <div style={{fontSize:22,fontWeight:700,color:hi?P.white:P.primary,lineHeight:1,fontFamily:"'Playfair Display',serif"}}>{value}</div>
    {sub&&<div style={{fontSize:11,color:subColor||(hi?'rgba(255,255,255,0.6)':P.muted),marginTop:5,fontWeight:500}}>{sub}</div>}
    {sub2&&<div style={{fontSize:11,color:sub2Color||(hi?'rgba(255,255,255,0.6)':P.muted),marginTop:2,fontWeight:600}}>{sub2}</div>}
  </div>
  );
};

}

function buildClinicDataRows(clinic) {
  const rows = [];
  const actYears = Object.keys(clinic.actuals).map(Number).sort();
  // Actuals per year
  actYears.forEach(yr => {
    const arr = clinic.actuals[yr];
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: arr[i]??null})),
      total: arr.filter(x=>x!=null).length ? sum(arr.filter(x=>x!=null)) : null,
    });
  });
  // Budget 2026 if exists
  const bgt = clinic.budget?.[2026];
  if(bgt && !bgt.every(x=>x==null)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgt[i]??null})),
      total: sum(bgt.filter(x=>x!=null)),
    });
    // Δ Actual vs Budget row
    const act2026 = clinic.actuals?.[2026];
    if(act2026) {
      const deltaVals = MONTHS.map((_,i) => {
        const a = act2026[i], b = bgt[i];
        return (a!=null && b!=null) ? a - b : null;
      });
      const deltaTotal = deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null;
      rows.push({
        label: 'Δ Actual vs Buget',
        isDelta: true,
        cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
        total: deltaTotal,
      });
    }
  }
  return rows;
}

function buildClusterDataRows(codes) {
  const rows = [];
  [2023,2024,2025,2026].forEach(yr => {
    const totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[yr]?.[i]||0), 0));
    const hasData = totals.some(v=>v>0);
    if(!hasData) return;
    rows.push({
      label: `${yr} Actual`,
      isBudget: false,
      cells: MONTHS.map((_,i) => ({v: totals[i]||null})),
      total: sum(totals.filter(v=>v>0)),
    });
  });
  // Budget 2026
  const bgtTotals = MONTHS.map((_,i) => codes.reduce((acc,c) => {
    const b = CD[c].budget?.[2026]; return acc + (b?.[i]||0);
  }, 0));
  if(bgtTotals.some(v=>v>0)) {
    rows.push({
      label: 'Budget 2026',
      isBudget: true,
      cells: MONTHS.map((_,i) => ({v: bgtTotals[i]||null})),
      total: sum(bgtTotals),
    });
    // Δ Actual vs Budget
    const act2026totals = MONTHS.map((_,i) => codes.reduce((acc,c) => acc + (CD[c].actuals[2026]?.[i]||0), 0));
    const deltaVals = MONTHS.map((_,i) => (act2026totals[i]>0 && bgtTotals[i]>0) ? act2026totals[i]-bgtTotals[i] : null);
    rows.push({
      label: 'Δ Actual vs Buget',
      isDelta: true,
      cells: MONTHS.map((_,i) => ({v: deltaVals[i]})),
      total: deltaVals.filter(x=>x!=null).length ? sum(deltaVals.filter(x=>x!=null)) : null,
    });
  }
  return rows;
}

// ─── Ramp-up Tab ─────────────────────────────────────────────────────────────
function RampupTab() {
  const [view, setView] = useState('table'); // 'table' | 'chart'
  const [highlight, setHighlight] = useState(null);

  const fmtM = (v) => {
    if(v==null) return null;
    if(v>=1e6) return (v/1e6).toFixed(2)+'M';
    if(v>=1e3) return (v/1e3).toFixed(0)+'K';
    return v.toFixed(0);
  };

  // Rândurile DA se recalculează din datele de vânzări (CD), ca să nu rămână cifre fixe vechi:
  //  · anii < 2026 = realizat an complet din CD (valorile fixe din RAMP rămân doar pentru anii fără date în CD)
  //  · 2026 = ESTIMARE: realizat Ian–luna curentă + buget pentru lunile rămase (marcat „e")
  //  · clinică fără vânzări realizate încă (Brăila) = doar buget, marcat distinct
  //  · 26/25 = YTD vs YTD (aceeași perioadă), doar dacă 2025 are toate lunile comparabile
  //  · CA/Unit = vânzări realizate ultimele 12 luni / unituri (anualizat dacă < 12 luni de activitate)
  const RAMP_CODE = {'Oltenița':'OLT','Giurgiu':'GRG','Dorobanți':'DRB','Cotroceni':'CTR','Slobozia':'SLB','Călărași':'CLR','Târgoviște':'TGV','Focșani':'FCS','Brăila':'BRL'};
  const yoyR = (a,b) => (a!=null&&b) ? Math.round((a-b)/b*100) : null;
  const daRows = RAMP.filter(r=>r.group==='DA').map(r=>{
    const code=RAMP_CODE[r.clinic], c=CD[code]; if(!c) return r;
    const a26=c.actuals[2026]||[], b26=c.budget[2026]||[];
    const ytdA=sum(a26.slice(0,ACT_MO).map(x=>x||0));
    const restB=sum(b26.slice(ACT_MO).map(x=>x||0));
    const years=r.years.map((v,i)=>{
      const y=r.start+i;
      if(y<2026){ const a=c.actuals[y]; return (a&&a.some(x=>x!=null)) ? sum(a.map(x=>x||0)) : v; }
      if(y===2026) return ytdA>0 ? ytdA+restB : sum(b26.map(x=>x||0));
      return null;
    });
    const at=y=>{ const i=y-r.start; return i>=0?years[i]:null; };
    const p25=(c.actuals[2025]||[]).slice(0,ACT_MO);
    const yoy2625 = (ytdA>0 && p25.length===ACT_MO && p25.every(x=>x!=null)) ? yoyR(ytdA,sum(p25)) : null;
    const ltm=[...(c.actuals[2025]||[]).slice(ACT_MO),...a26.slice(0,ACT_MO)].filter(x=>x!=null);
    const caUnit = (r.units&&ltm.length) ? sum(ltm)/ltm.length*12/r.units : null;
    return {...r, code, years, ytdA, estIdx:2026-r.start, estKind: ytdA>0?'est':'bud',
      yoy2423:yoyR(at(2024),at(2023)), yoy2524:yoyR(at(2025),at(2024)), yoy2625,
      caUnit, caAnn: ltm.length>0&&ltm.length<12, caNone: !ltm.length};
  });
  const DR = Object.fromEntries(daRows.map(r=>[r.code,r]));
  const e26 = code => DR[code]?.years[DR[code].estIdx];
  const cRows  = RAMP.filter(r=>r.group==='C');

  // Chart data: index by year offset, one line per clinic
  const maxYears = 9; // show Y0–Y8 in chart
  const chartData = Array.from({length:maxYears},(_,yi)=>({
    label:`Y${yi}`,
    ...[...daRows,...cRows].reduce((o,r)=>({...o,[`${r.clinic}`]:r.years[yi]??null}),{})
  }));

  const yoyBadge = (v, size='sm') => {
    if(v==null) return <span style={{color:'#CCC',fontSize:9}}>—</span>;
    const bg = v>=0?'#DCFCE7':'#FEE2E2';
    const col = v>=0?'#15803D':P.alert;
    return <span style={{display:'inline-block',padding:size==='lg'?'3px 9px':'2px 6px',borderRadius:20,fontSize:size==='lg'?11:10,fontWeight:700,background:bg,color:col}}>{v>0?'+':''}{v}%</span>;
  };

  // Max Y value across DA for bar scaling
  const daMax = Math.max(...daRows.map(r=>Math.max(...r.years.filter(x=>x!=null))));
  const allMax = Math.max(...[...daRows,...cRows].map(r=>Math.max(...r.years.filter(x=>x!=null))));

  const rowColors = { DA: P.primary, C: '#888' };

  const TableSection = ({rows, title, color, isDA, unit}) => (
    <div style={{marginBottom: isDA?0:0}}>
      {/* Section header */}
      <div style={{background:color,padding:'8px 16px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:6,height:6,borderRadius:1,background:'rgba(255,255,255,0.6)',transform:'rotate(45deg)'}}/>
        <span style={{fontSize:11,fontWeight:700,color:P.white,letterSpacing:1,textTransform:'uppercase'}}>{title}</span>
        <span style={{fontSize:10,color:'rgba(255,255,255,0.5)',marginLeft:4}}>{rows.length} {unit||'clinici'}</span>
      </div>
      {rows.map((r,i)=>{
        const isHL = highlight===`${r.op}-${r.clinic}`;
        const maxVal = Math.max(...r.years.filter(x=>x!=null));
        const lastV = r.years.filter(x=>x!=null).slice(-1)[0];
        return (
          <div key={i}
            onMouseEnter={()=>setHighlight(`${r.op}-${r.clinic}`)}
            onMouseLeave={()=>setHighlight(null)}
            style={{
              display:'grid',
              gridTemplateColumns:'130px 160px 44px 44px repeat(12,1fr) 68px 68px 68px 74px',
              borderBottom:`1px solid #F0F0F0`,
              background: isHL?(isDA?`${P.primary}08`:'#F8F8F8'):(i%2===0?P.white:'#FAFAFA'),
              transition:'background 0.1s',
              alignItems:'center',
            }}>
            {/* Operator */}
            <div style={{padding:'9px 12px',fontSize:10,fontWeight:isDA?700:500,color:isDA?P.primary:'#555'}}>{r.op}</div>
            {/* Clinic */}
            <div style={{padding:'9px 8px',fontSize:11,fontWeight:600,color:isDA?P.primary:'#333'}}>
              <div>{r.clinic}</div>
              <div style={{fontSize:9,color:P.muted,marginTop:1}}>Start {r.start}{r.units ? ' · '+r.units+' unituri' : ''}</div>
            </div>
            {/* Start year badge */}
            <div style={{padding:'9px 4px',textAlign:'center'}}>
              <span style={{fontSize:9,fontWeight:700,color:P.white,background:isDA?P.primary:'#999',borderRadius:3,padding:'2px 5px'}}>{r.start}</span>
            </div>
            {/* Y0 label */}
            <div style={{padding:'9px 4px',textAlign:'center',fontSize:9,color:P.muted,fontStyle:'italic'}}>Y0</div>
            {/* Year columns Y0–Y11 */}
            {r.years.map((v,yi)=>{
              const isLatest = v!=null && r.years[yi+1]==null && yi>0;
              const isEst = isDA && r.estIdx===yi && r.estKind;
              const isPeak = v!=null && v===maxVal && yi>0;
              return (
                <div key={yi} style={{padding:'7px 4px',textAlign:'right'}}>
                  {v!=null ? (
                    <div>
                      <div style={{
                        fontSize:10,fontWeight:isPeak?800:isDA?600:400,
                        color:isPeak?(isDA?P.primary:'#5B3F8A'):isLatest?(isDA?P.olive:'#16803C'):'#444',
                        fontStyle:isEst?'italic':'normal',
                      }} title={isEst==='est'?`Estimare 2026: realizat Ian–${MONTHS[ACT_MO-1]} ${fmtM(r.ytdA)} + buget ${MONTHS[ACT_MO]||''}–Dec`:isEst==='bud'?'Doar buget 2026 — fără vânzări realizate încă':undefined}>{fmtM(v)}{isEst==='est'?<sup style={{fontSize:7,marginLeft:1}}>e</sup>:isEst==='bud'?<sup style={{fontSize:7,marginLeft:1}}>b</sup>:null}</div>
                      {/* mini bar */}
                      <div style={{height:2,background:'#EEE',borderRadius:1,marginTop:2,width:'100%'}}>
                        <div style={{height:'100%',width:`${(v/allMax)*100}%`,maxWidth:'100%',background:isDA?(isPeak?P.primary:P.terracotta):(isPeak?'#5B3F8A':'#AAA'),borderRadius:1}}/>
                      </div>
                    </div>
                  ) : <span style={{color:'#E0E0E0',fontSize:9}}>·</span>}
                </div>
              );
            })}
            {/* YoY columns */}
            <div style={{padding:'7px 6px',textAlign:'center'}}>{yoyBadge(r.yoy2423)}</div>
            <div style={{padding:'7px 6px',textAlign:'center'}}>{yoyBadge(r.yoy2524)}</div>
            <div style={{padding:'7px 6px',textAlign:'center'}}>{yoyBadge(r.yoy2625,'lg')}</div>
            <div style={{padding:'7px 6px',textAlign:'center'}}>
              {isDA && r.code ? (r.caUnit!=null ? (
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:P.primary}}>{fmtM(r.caUnit)}</div>
                  <div style={{fontSize:8,color:P.muted}}>{r.units} unituri{r.caAnn?' · anualizat':''}</div>
                </div>
              ) : <span style={{color:'#CCC',fontSize:9}} title="Fără vânzări realizate încă">—</span>)
              : r.units && lastV ? (
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:isDA?P.primary:'#5B3F8A'}}>{fmtM(lastV/r.units)}</div>
                  <div style={{fontSize:8,color:P.muted}}>{r.units} unituri</div>
                </div>
              ) : <span style={{color:'#CCC',fontSize:9}}>—</span>}
            </div>
          </div>
        );
      })}
    </div>
  );

  return (
    <div>
      {/* Main table */}
      <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:12,overflow:'hidden',boxShadow:'0 2px 12px rgba(0,0,0,0.07)'}}>

        {/* Table header */}
        <div style={{background:P.primary,padding:'12px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:P.white,fontFamily:"'Playfair Display',serif"}}>Ramp-up Comparativ · Dr. Ardeleanu vs Concurență</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,0.5)',marginTop:2}}>Vânzări anuale de la Year 0 (an incomplet de deschidere) · RON · DA 2026<sup>e</sup> = estimare: realizat Ian–{MONTHS[ACT_MO-1]} + buget {MONTHS[ACT_MO]||''}–Dec · <sup>b</sup> = doar buget · 26/25 = YTD vs YTD · CA/Unit DA = realizat ultimele 12 luni / unituri; concurență = ultimul an raportat / unituri</div>
          </div>
          <div style={{display:'flex',gap:16,alignItems:'center'}}>
            {[['Peak',P.wheat],['Ultimul an',P.olive],['DA','rgba(255,255,255,0.7)'],['Concurență','#AAA']].map(([l,c])=>(
              <div key={l} style={{display:'flex',alignItems:'center',gap:5}}>
                <div style={{width:8,height:3,borderRadius:1,background:c}}/>
                <span style={{fontSize:10,color:'rgba(255,255,255,0.55)'}}>{l}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Column headers */}
        <div style={{
          display:'grid',
          gridTemplateColumns:'130px 160px 44px 44px repeat(12,1fr) 68px 68px 68px 74px',
          background:'#F8F4F4',
          borderBottom:`2px solid ${P.primary}`,
        }}>
          <div style={{padding:'8px 12px',fontSize:9,fontWeight:700,color:P.primary,textTransform:'uppercase',letterSpacing:0.6}}>Operator</div>
          <div style={{padding:'8px 8px',fontSize:9,fontWeight:700,color:P.primary,textTransform:'uppercase',letterSpacing:0.6}}>Clinică</div>
          <div style={{padding:'8px 4px',textAlign:'center',fontSize:9,fontWeight:600,color:P.muted}}>Start</div>
          <div style={{padding:'8px 4px',textAlign:'center',fontSize:9,fontWeight:600,color:P.muted}}/>
          {YEAR_LABELS.map(y=>(
            <div key={y} style={{padding:'8px 4px',textAlign:'right',fontSize:9,fontWeight:700,color:P.primary}}>{y}</div>
          ))}
          <div style={{padding:'8px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#7B5EA7'}}>24/23</div>
          <div style={{padding:'8px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#5B3F8A'}}>25/24</div>
          <div style={{padding:'8px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:'#2D7D46'}}>26/25 YTD</div>
          <div style={{padding:'8px 6px',textAlign:'center',fontSize:9,fontWeight:700,color:P.primary}}>CA/Unit</div>
        </div>

        <TableSection rows={daRows} title="Dr. Ardeleanu Dental Clinics" color={P.primary} isDA={true}/>
        <TableSection rows={cRows}  title="Concurență Relevantă" color="#666" isDA={false} unit="societăți (CUI)"/>
      </div>

      {/* Insight cards */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14,marginTop:16}}>
        <Card>
          <Sec>Viteză de Ramp-up DA</Sec>
          {[
            ['Slobozia',`Y1: ${fmtM(DR.SLB.years[1])} · cel mai rapid ramp-up`,'green'],
            ['Călărași',`Y0: ${fmtM(DR.CLR.years[0])} · start excepțional`,'green'],
            ['Târgoviște',`Y1 (2026e): ${fmtM(e26('TGV'))} · realizat Ian–${MONTHS[ACT_MO-1]}: ${fmtM(DR.TGV.ytdA)}${BUDGET_FLAGS.TGV?' · buget de confirmat':''}`,'green'],
            ['Cotroceni',`Y1: ${fmtM(DR.CTR.years[1])} → Y3 (2026e): ${fmtM(e26('CTR'))} · YTD ${pct0(DR.CTR.yoy2625)} YoY`,'amber'],
          ].map(([c,t,type])=><Pill key={c} type={type}><b>{c}</b> — {t}</Pill>)}
        </Card>
        <Card>
          <Sec>Benchmark vs Concurență</Sec>
          {[
            ['Slobozia vs Dental Blue Slobozia','DA depășește în Y2 nivelul Y5 al concurenței','green'],
            ['Târgoviște vs CM Prolife + Elida',`DA 2026e: ${fmtM(e26('TGV'))} (primul an complet) · Elida a accelerat în 2025: +47% (8.67M)`,'amber'],
            ['Focșani vs Dentrust',`DA 2026e: ${fmtM(e26('FCS'))} (realizat Mar–${MONTHS[ACT_MO-1]}: ${fmtM(DR.FCS.ytdA)}) · Denta Vital 2025: 10.05M (+53%) · grup 4 CUI, exclus din tabel: 16.59M`,'red'],
            ['Oltenița maturitate',`Y8 (2026e): ${fmtM(e26('OLT'))} · YTD ${pct0(DR.OLT.yoy2625)} YoY — creștere plată, sub buget YTD`, DR.OLT.yoy2625!=null&&DR.OLT.yoy2625<5?'amber':'green'],
          ].map(([c,t,type])=><Pill key={c} type={type}><b>{c}</b> — {t}</Pill>)}
        </Card>
        <Card>
          <Sec>Observații Strategice</Sec>
          {[
            ['Pattern DA','Clinicile DA ating Y1 rapid dar cu baze solide în Y0','green'],
            DR.GRG.yoy2625!=null&&DR.GRG.yoy2625<8 ? ['Risc Giurgiu',`YoY YTD 26/25: ${pct0(DR.GRG.yoy2625)} · baza ridicată comprimă creșterea`,'amber'] : ['Giurgiu',`YoY YTD 26/25: ${pct0(DR.GRG.yoy2625)} · creștere solidă pe cea mai mare bază din rețea`,'green'],
            ['Potențial Cotroceni',`2026e: ${fmtM(e26('CTR'))} · CA/unit ${fmtM(DR.CTR.caUnit)} pe ${DR.CTR.units} unituri`,'amber'],
            ['Brăila 2026',DR.BRL.ytdA>0?`Realizat YTD ${fmtM(DR.BRL.ytdA)} · urmărire necesară în Y1`:`Deschidere planificată Nov 2026 · buget Nov–Dec ${fmtM(e26('BRL'))} · fără vânzări realizate încă`,'amber'],
          ].map(([c,t,type])=><Pill key={c} type={type}><b>{c}</b> — {t}</Pill>)}
        </Card>
      </div>

      {/* Observații pe competitor */}
      <CompetitorNotes/>
    </div>
  );
}

// ─── Network Tab ──────────────────────────────────────────────────────────────
function NetworkTab({period}) {
  const n26=netv(period), n25=sum(period==='Month'?[NET.actuals[2025][ACT_MO-1]]:period==='YTD'?NET.actuals[2025].slice(0,ACT_MO):NET.actuals[2025].filter(x=>x!==null));
  const nb=netb(period);
  const yoy=gr(n26,n25), vb=gr(n26,nb);
  const lfl26=LFL.reduce((a,c)=>a+(val(CD[c],2026,period)||0),0);
  const lfl25=LFL.reduce((a,c)=>a+(val(CD[c],2025,period)||0),0);
  const lfl=gr(lfl26,lfl25);
  // ── Comentariu calculat din date (nu text fix) ──
  const dNet=n26-n25, dLfl=lfl26-lfl25, dNew=dNet-dLfl;
  const newCodes=Object.keys(CD).filter(c=>!LFL.includes(c)&&val(CD[c],2026,period));
  const bMonths=MONTHS.slice(0,ACT_MO).map((m,i)=>({m,d:(NET.actuals[2026][i]||0)-(NET.budget[2026][i]||0)}));
  const bBelow=bMonths.filter(x=>x.d<0).map(x=>x.m);
  const vbYtd=gr(netv('YTD'),netb('YTD'));
  const kRON=v=>(v>=0?'+':'−')+fmt(Math.abs(v));
  const isMonth=period==='Month';
  const underBud=Object.values(CD).map(c=>{ const a=val(c,2026,'YTD'), b=bval(c,2026,'YTD');
      const p25=(c.actuals[2025]||[]).slice(0,ACT_MO), cmp=p25.length===ACT_MO&&p25.every(x=>x!=null);
      return (a&&b)?{c,a,b,d:a-b,g:gr(a,b),yoy:cmp?gr(a,val(c,2025,'YTD')):null}:null; })
    .filter(x=>x&&x.d<0).sort((x,y)=>x.d-y.d);
  const mi=ACT_MO-1;
  const baseFx=Object.values(CD).map(c=>{ const a25=c.actuals[2025]; if(!a25||mi<1||!a25[mi]||!a25[mi-1]) return null;
      const yoyM=gr(c.actuals[2026][mi],a25[mi]), dip=gr(a25[mi],a25[mi-1]);
      return (yoyM!=null&&yoyM>=25&&dip<=-20)?{c,yoyM,dip}:null; }).filter(Boolean);

  const monthly=MONTHS.slice(0,ACT_MO).map((m,i)=>({month:m,'2025':NET.actuals[2025][i]||0,'2026':NET.actuals[2026][i]||0,'Budget':NET.budget[2026][i]||0}));
  const annual=[2022,2023,2024,2025].map(yr=>({year:`${yr}`,rev:sum(NET.actuals[yr].filter(x=>x!==null))}));
  annual.push({year:'2026B',rev:sum(NET.budget[2026]),est:true});
  const bars=Object.values(CD).map(c=>{
    const v26=val(c,2026,period)||0, v25=val(c,2025,period)||0;
    const hasAny2026=(c.actuals[2026]||[]).some(x=>x!=null);
    // LFL: only for clinics with comparable prior-year data in the same period
    const isLFL=LFL.includes(c.code);
    const lflG=isLFL?gr(v26,v25||null):null;
    return {name:c.name,code:c.code,cl:c.cluster,v26,v25,g:gr(v26,v25),lflG,isLFL,hasAny2026};
  }).filter(x=>x.hasAny2026);

  return <div>
    {/* ── Antet rețea: cifra principală + 3 indicatori explicați + progres față de bugetul anual ── */}
    {(()=>{
      const mi=ACT_MO-1, isM=period==='Month';
      const a26=NET.actuals[2026], a25=NET.actuals[2025], b26=NET.budget[2026];
      const ytd26=netv('YTD'), fyB=sum(b26), estFY=ytd26+sum(b26.slice(ACT_MO));
      const prog=ytd26/fyB, elapsed=ACT_MO/12;
      const sparkMax=Math.max(...a26.slice(0,ACT_MO), ...b26.slice(0,ACT_MO));
      const gShare=dNet?Math.max(0,Math.min(1,dLfl/dNet)):0;
      const good='#15803D', bad=P.alert;
      const Tile=HeadTile;
      return (
      <div style={{marginBottom:16}}>
        <div className="net-head">
          {/* Cifra principală */}
          <div className="net-hero" style={{background:`linear-gradient(145deg, ${P.primary} 0%, #5E140F 100%)`,borderRadius:14,padding:'18px 20px',color:P.white,boxShadow:'0 4px 18px rgba(123,28,22,0.22)',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:8}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:0.9,textTransform:'uppercase',color:'rgba(255,255,255,0.7)'}}>Vânzări rețea · {pLabel(period)}</div>
            </div>
            <div style={{display:'flex',alignItems:'baseline',gap:8}}>
              <span style={{fontSize:42,fontWeight:700,lineHeight:1,fontFamily:"'Playfair Display',serif"}}>{fmt(n26)}</span>
              <span style={{fontSize:12,color:'rgba(255,255,255,0.65)'}}>RON</span>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              <span style={{background:'rgba(255,255,255,0.14)',borderRadius:20,padding:'3px 9px',fontSize:11,fontWeight:600}}>{pct(yoy)} vs {isM?`${MONTHS[mi]} 2025`:'2025'} · {fmt(n25)}</span>
              <span style={{background:vb>=0?'rgba(181,189,92,0.30)':'rgba(217,48,37,0.35)',borderRadius:20,padding:'3px 9px',fontSize:11,fontWeight:600}}>{kRON(n26-nb)} vs buget ({pct(vb)})</span>
            </div>
            {/* evoluție lunară 2026 — bară = realizat, linie fină = buget; luna/perioada selectată e accentuată */}
            <div>
              <div style={{display:'flex',alignItems:'flex-end',gap:4,height:46}}>
                {a26.slice(0,ACT_MO).map((v,i)=>{
                  const on=isM?i===mi:true, bh=b26[i]/sparkMax*46;
                  return <div key={i} title={`${MONTHS[i]} 26: ${fmt(v)} · buget ${fmt(b26[i])} (${pct(gr(v,b26[i]))}) · YoY ${pct(gr(v,a25[i]))}`}
                    style={{flex:1,position:'relative',height:'100%',display:'flex',alignItems:'flex-end',cursor:'default'}}>
                    <div style={{width:'100%',height:`${v/sparkMax*100}%`,background:on?P.wheat:'rgba(255,255,255,0.28)',borderRadius:'3px 3px 0 0'}}/>
                    <div style={{position:'absolute',left:-1,right:-1,bottom:bh-1,height:2,background:v>=b26[i]?'#B5BD5C':'#FF8A80',borderRadius:1}}/>
                  </div>;
                })}
              </div>
              <div style={{display:'flex',gap:4,marginTop:4}}>
                {MONTHS.slice(0,ACT_MO).map((m,i)=><div key={m} style={{flex:1,textAlign:'center',fontSize:8.5,color:(isM?i===mi:true)?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.45)'}}>{m}</div>)}
              </div>
              <div style={{fontSize:9,color:'rgba(255,255,255,0.55)',marginTop:4}}>bară = vânzări 2026 · linie = buget (verde peste, roșu sub)</div>
            </div>
          </div>

          {/* Creștere: din ce vine */}
          <Tile label="Creștere YoY" value={pct0(yoy)} valueColor={yoy>=0?good:bad} caption={`vs ${isM?MONTHS[mi]+' 2025':'2025'}`}>
            <div style={{display:'flex',height:8,borderRadius:4,overflow:'hidden',gap:2,margin:'2px 0 6px'}} title={`LFL ${kRON(dLfl)} · clinici noi ${kRON(dNew)}`}>
              <div style={{width:`${gShare*100}%`,background:P.primary,borderRadius:'4px 0 0 4px'}}/>
              <div style={{flex:1,background:P.wheat,borderRadius:'0 4px 4px 0'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',gap:6}}>
              <span><span style={{display:'inline-block',width:7,height:7,borderRadius:2,background:P.primary,marginRight:4}}/>comparabile <b>{kRON(dLfl)}</b></span>
              <span><span style={{display:'inline-block',width:7,height:7,borderRadius:2,background:P.wheat,marginRight:4}}/>noi <b>{kRON(dNew)}</b></span>
            </div>
            <div style={{color:P.muted,marginTop:3}}>{kRON(dNet)} RON în total · clinici noi: {newCodes.join(', ')}</div>
          </Tile>

          {/* Organic */}
          <Tile label="Creștere organică (LFL)" value={pct0(lfl)} valueColor={lfl>=0?good:bad} caption="clinici comparabile">
            <b>{fmt(lfl26)}</b> vs {fmt(lfl25)} la cele 6 clinici cu istoric complet
            <div style={{color:P.muted,marginTop:3}}>{LFL.join(' · ')}</div>
          </Tile>

          {/* Buget */}
          <Tile label="Față de buget" value={pct(vb)} valueColor={vb>=0?good:bad} caption={pLabel(period)}>
            <b>{kRON(n26-nb)} RON</b> · buget {fmt(nb)}
            <div style={{display:'flex',gap:3,margin:'7px 0 4px'}}>
              {bMonths.map((x,i)=><div key={x.m} title={`${x.m}: ${kRON(x.d)} vs buget`} style={{flex:1,height:14,borderRadius:3,background:x.d>=0?'#DCFCE7':'#FEE2E2',border:`1px solid ${x.d>=0?'#86EFAC':'#FCA5A5'}`,outline:isM&&i===mi?`2px solid ${P.primary}`:'none',outlineOffset:1}}/>)}
            </div>
            <div style={{color:P.muted}}>peste buget în <b style={{color:P.text}}>{ACT_MO-bBelow.length} din {ACT_MO}</b> luni{bBelow.length?` · sub: ${bBelow.join(', ')}`:''}</div>
          </Tile>
        </div>

        {/* Progres față de bugetul anual */}
        <div style={{marginTop:12,background:P.white,border:`1px solid ${P.border}`,borderRadius:12,padding:'12px 16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:8,marginBottom:8}}>
            <div style={{fontSize:10,fontWeight:700,color:P.muted,textTransform:'uppercase',letterSpacing:0.8}}>Progres față de bugetul anual 2026</div>
            <div style={{fontSize:11.5,color:'#555'}}>
              <b style={{color:P.primary}}>{fmt(ytd26)}</b> realizat din <b>{fmt(fyB)}</b> ({Math.round(prog*100)}%) · timp scurs {ACT_MO}/12 luni ({Math.round(elapsed*100)}%) · estimare an: <b style={{color:estFY>=fyB?good:bad}} title={`Realizat Ian–${MONTHS[mi]} + buget ${MONTHS[ACT_MO]||''}–Dec`}>{fmt(estFY)}</b> ({kRON(estFY-fyB)} vs buget)
            </div>
          </div>
          <div style={{position:'relative',height:10,background:'#F1ECE6',borderRadius:5}}>
            <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${Math.min(prog,1)*100}%`,background:`linear-gradient(90deg, ${P.primary}, #A0352C)`,borderRadius:5}}/>
            <div title={`timp scurs: ${ACT_MO}/12 luni`} style={{position:'absolute',left:`calc(${elapsed*100}% - 1px)`,top:-4,bottom:-4,width:2,background:P.text,borderRadius:1}}/>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:P.muted,marginTop:4}}>
            <span>Ian</span><span>marcaj = timp scurs din an · {prog>=elapsed?'înaintea ritmului necesar':'sub ritmul necesar'}</span><span>Dec</span>
          </div>
        </div>
      </div>);
    })()}

    {/* ── Analiză: ce merge bine / ce trebuie urmărit ── */}
    {(()=>{
      const pos=[], watch=[];
      (yoy>=0?pos:watch).push({t:`Rețea ${pct(yoy)} YoY (${kRON(dNet)} RON)`, d:`${dNet?Math.round(dLfl/dNet*100):0}% din creștere vine din clinicile comparabile, restul din clinicile noi (${newCodes.join(', ')}).`});
      (lfl>=0?pos:watch).push({t:`Creștere organică ${pct(lfl)}`, d:`La clinicile cu minimum 1 an complet de activitate (Cluster 1 + DRB + CTR), fără efectul expansiunii.`});

// ─── Network Monthly History (embedded in Rețea tab) ─────────────────────────
// Reproduces the historical monthly sales trend from the MTD report ("Sales YTD
// Trend" chart). Built from the dashboard's own NET monthly actuals (facturat) so
// it stays fully consistent with every other tab.
function NetHistory() {
  const HIST_YEARS = [2022,2023,2024,2025,2026];
  const series = [];
  HIST_YEARS.forEach(yr => {
    const av = NET.actuals[yr]||[];
    const bv = NET.budget[yr]||null;
    MONTHS.forEach((_,i) => {
      const future2026 = (yr===2026 && i>=ACT_MO);   // Iun–Dec 2026: budget only
      const a = future2026 ? null : av[i];
      const b = bv ? bv[i] : null;
      // include a point if there's an actual, or it's a future 2026 month carrying a budget
      if (a==null && !(future2026 && b!=null)) return;
      const both = a!=null && b!=null;
      series.push({
        label:`${MONTHS[i]} ${String(yr).slice(2)}`, value:a, bud:b, year:yr, mi:i, proj:future2026,
        over:  both && a>=b ? [b,a] : null,   // favourable gap band (actual above budget)
        under: both && a<b  ? [a,b] : null,   // unfavourable gap band (actual below budget)
      });
    });
  });

  const actuals = series.filter(d=>d.value!=null);
  const latest  = actuals[actuals.length-1];                 // last actual month (Mai 26)
  const peak    = actuals.reduce((m,d)=>d.value>m.value?d:m, actuals[0]);
  const last12  = actuals.slice(-12);
  const avg12   = Math.round(last12.reduce((a,d)=>a+d.value,0)/last12.length);
  const prevYearSame = actuals.find(d=>d.year===latest.year-1 && d.mi===latest.mi);
  const yoyLatest = prevYearSame ? gr(latest.value, prevYearSame.value) : null;
  const latVsBud  = latest.bud ? gr(latest.value, latest.bud) : null;
  const fyBudget  = sum(NET.budget[2026]);
  const ytdA = NET.actuals[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdB = NET.budget[2026].slice(0,ACT_MO).reduce((s,v)=>s+(v||0),0);
  const ytdGap = ytdA - ytdB, ytdGapPct = gr(ytdA, ytdB);
  const yearStarts = series.filter(d=>d.mi===0);

  const Stat = ({k,v,vc}) => (
    <span style={{fontSize:11,color:P.muted}}><b style={{color:P.primary}}>{k}:</b> <span style={{color:vc||P.text,fontWeight:600}}>{v}</span></span>
  );

  // Dedicated tooltip — shows actual, budget and the gap (ecart) for the hovered month
  const HistTip = ({active,payload}) => {
    if(!active||!payload?.length) return null;
    const p = payload[0].payload;
    const gap = (p.value!=null && p.bud!=null) ? p.value-p.bud : null;
    const gc = gap==null ? P.muted : gap>=0 ? '#2D7D46' : P.alert;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif",minWidth:150}}>
      <div style={{fontWeight:700,marginBottom:5,color:P.primary,fontSize:12,fontFamily:"'Playfair Display',serif"}}>{p.label}{p.proj?' · proiecție':''}</div>
      {p.value!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}><span style={{color:P.primary,fontWeight:500}}>Actual</span><b>{fmt(p.value)}</b></div>}
      {p.bud!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginBottom:2}}><span style={{color:P.amber,fontWeight:500}}>Buget</span><b>{fmt(p.bud)}</b></div>}
      {gap!=null && <div style={{display:'flex',justifyContent:'space-between',gap:18,marginTop:4,paddingTop:4,borderTop:`1px solid ${P.border}`}}><span style={{color:gc,fontWeight:600}}>Ecart</span><b style={{color:gc}}>{(gap>=0?'+':'')+fmt(gap)} ({pct(gr(p.value,p.bud))})</b></div>}
    </div>;
  };

  return (
    <Card style={{marginBottom:16}}>
      <Sec>Istoric Vânzări Lunare Rețea vs Buget — {series[0].label} → {series[series.length-1].label} (RON)</Sec>
      <div style={{display:'flex',gap:20,flexWrap:'wrap',marginBottom:12,paddingBottom:11,borderBottom:`1px solid ${P.border}`}}>
        <Stat k="Ultima lună actual" v={`${fmt(latest.value)} (${latest.label}, YoY ${pct0(yoyLatest)})`} vc={pcol(yoyLatest)}/>
        <Stat k={'Ecart vs Buget ('+latest.label+')'} v={`${latest.value-latest.bud>=0?'+':''}${fmt(latest.value-latest.bud)} (${pct(latVsBud)})`} vc={pcol(latVsBud)}/>
        <Stat k="Ecart YTD '26" v={`${ytdGap>=0?'+':''}${fmt(ytdGap)} (${pct(ytdGapPct)})`} vc={pcol(ytdGapPct)}/>
        <Stat k="Buget FY26" v={fmt(fyBudget)}/>
        <Stat k="Vârf istoric" v={`${fmt(peak.value)} (${peak.label})`}/>
      </div>
      <ResponsiveContainer width="100%" height={380}>
        <ComposedChart data={series} margin={{top:14,right:20,bottom:30,left:5}}>
          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
          <XAxis dataKey="label" tick={{fontSize:9,fill:P.muted}} axisLine={false} tickLine={false}
                 interval={2} angle={-40} textAnchor="end" height={50}/>
          <YAxis tickFormatter={v=>(v/1e6).toFixed(1)+'M'} tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
          <Tooltip content={<HistTip/>}/>
          {yearStarts.map(ys=>(
            <ReferenceLine key={ys.year} x={ys.label} stroke="#E0E0E0" strokeDasharray="2 4"
              label={{value:`${ys.year}`,position:'top',fontSize:9,fill:P.muted}}/>
          ))}
          <ReferenceLine x={latest.label} stroke={P.primary} strokeOpacity={0.45} strokeDasharray="4 3"
            label={{value:'buget proiectat →',position:'insideTopRight',fontSize:9,fill:P.primary,fontWeight:600}}/>
          {/* Variance bands — the gap between budget and realised sales */}
          <Area type="monotone" dataKey="under" stroke="none" fill={P.alert} fillOpacity={0.34}
                name="Ecart nefavorabil" connectNulls={false} activeDot={false} isAnimationActive={false} legendType="none"/>
          <Area type="monotone" dataKey="over"  stroke="none" fill="#2D7D46" fillOpacity={0.28}
                name="Ecart favorabil"  connectNulls={false} activeDot={false} isAnimationActive={false} legendType="none"/>
          <Line type="monotone" dataKey="bud" stroke={P.amber} strokeWidth={2} dot={false}
                strokeDasharray="5 4" name="Buget" connectNulls={false}/>
          <Area type="monotone" dataKey="value" stroke={P.primary} strokeWidth={2.4}
                fill={P.primary} fillOpacity={0} name="Vânzări lunare" dot={false} connectNulls={false}
                activeDot={{r:5,fill:P.primary,stroke:P.white,strokeWidth:2}}/>
        </ComposedChart>
      </ResponsiveContainer>
      <Legend items={[[P.primary,'Vânzări (actual)'],[P.amber,'Buget',true],['#2D7D46','Ecart favorabil (peste buget)'],[P.alert,'Ecart nefavorabil (sub buget)']]}/>
      <div style={{fontSize:10,color:P.muted,marginTop:8,fontStyle:'italic',lineHeight:1.5}}>
        Banda colorată = ecartul lunar dintre vânzările realizate și buget (verde = peste buget, roșu = sub buget). Actuals (facturat) până în {latest.label}; bugetul continuă până în Dec 26.
        Sursă buget: fișierul de date (2023–2026; 2022 fără buget la nivel de rețea). Liniile verticale marchează începutul fiecărui an.
      </div>
    </Card>
  );
}

// ─── Mix pe categorii pentru clinici si clustere (din Sales Split) ─────────────
const mixFor = (codes, period) => {
  const src = CLINIC_MIX[ACT_MO]; if (!src) return null;
  const m = src[period==='Month' ? 'M' : 'Y'];
  const acc = {}; let tot = 0;
  codes.forEach(code => {
    const mix = m[code]; if (!mix) return;
    const sales = val(CD[code], 2026, period) || 0;
    tot += sales;
    for (const k in mix) acc[k] = (acc[k]||0) + mix[k]*sales/100;
  });
  if (!tot) return null;
  const out = {};
  for (const k in acc) out[k] = acc[k]/tot*100;
  return {pct: out, sales: tot};
};

            <div style={{display:'flex',justifyContent:'space-between'}}><span>Implantologie <b>{sIMP.toFixed(1)}%</b></span><span>Protetică <b>{sPRO.toFixed(1)}%</b></span></div>
          </HeadTile>

          <HeadTile label="Cel mai mare câștig de pondere" value={dFmt(gain.dPP)} valueColor={gain.dPP>=0?good:bad} caption={gain.name}>
            {gain.sApr25.toFixed(1)}% → <b>{gain.sApr26.toFixed(1)}%</b> din mix · {fmt(gain.v)} RON
            <div style={{color:P.muted,marginTop:3}}>încasări {pct(rG(gain))} vs {vs}</div>
          </HeadTile>

          <HeadTile label="Cea mai mare pierdere de pondere" value={dFmt(loss.dPP)} valueColor={loss.dPP>=0?good:bad} caption={loss.name}>
            {loss.sApr25.toFixed(1)}% → <b>{loss.sApr26.toFixed(1)}%</b> din mix · {fmt(loss.v)} RON
            <div style={{color:P.muted,marginTop:3}}>încasări {pct(rG(loss))} vs {vs}</div>
          </HeadTile>
        </div>
      </div>);
    })()}

    {(()=>{
      const ci=CIDX(), isM=period==='Month';
      const prevVal = k => isM ? CAT_DATA[k][ci-12] : catSumRange(k,0,ci-12);
      const vs = isM ? `${MONTHS[ACT_MO-1]} 2025` : 'YTD 2025';
      const rG = r => gr(r.v, prevVal(r.key));
      const pos=[], watch=[];
      const dEng=dIMP+dPRO;
      (dEng>-1?pos:watch).push({t:`Implantologie + Protetică = ${(sIMP+sPRO).toFixed(1)}% din încasări`, d:`${dEng>=0?'+':''}${dEng.toFixed(1)}pp vs ${vs} — ${Math.abs(dEng)<1?'pondere stabilă a celor două motoare comerciale':dEng>0?'motoarele comerciale își consolidează ponderea':'ponderea motoarelor comerciale scade'}.`});
      rows.filter(r=>r.dPP!=null&&r.dPP>=1).forEach(r=>pos.push({t:`${r.name}: ${dFmt(r.dPP)} pondere`, d:`${r.sApr25.toFixed(1)}% → ${r.sApr26.toFixed(1)}% din mix · ${fmt(r.v)} RON, ${pct(rG(r))} vs ${vs}.`}));
      rows.filter(r=>r.dPP!=null&&r.dPP<=-1).forEach(r=>watch.push({t:`${r.name}: ${dFmt(r.dPP)} pondere`, d:`${r.sApr25.toFixed(1)}% → ${r.sApr26.toFixed(1)}% din mix · ${fmt(r.v)} RON, ${pct(rG(r))} vs ${vs}${rG(r)!=null&&rG(r)>0?' — crește în RON, dar mai lent decât restul':''}.`}));
      rows.filter(r=>rG(r)!=null&&rG(r)<0&&!(r.dPP<=-1)).forEach(r=>watch.push({t:`${r.name}: încasări în scădere`, d:`${pct(rG(r))} vs ${vs} (${fmt(r.v)} RON).`}));
      if(isM && dIMPmom<=-1) watch.push({t:`Implantologie ${dFmt(dIMPmom)} față de ${CAT_MONTHS[ci-1]}`, d:`Pondere ${sIMPmar.toFixed(1)}% → ${sIMP.toFixed(1)}% de la o lună la alta — verificați pipeline-ul CT și planurile de tratament pentru luna următoare.`});
      return <InsightPanel title="Analiză mix" sub={`${catPLabel} · pondere în încasări · calculat din date`} pos={pos} watch={watch}/>;
    })()}

    {/* Two-column charts */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
      <Card>
        <Sec>Compoziție pe Categorii — {catPLabel}</Sec>
        <ResponsiveContainer width="100%" height={340}>

            {top4Keys.map((k,i) => (

                    stroke={top4Colors[i]} strokeWidth={2.5}

        </ResponsiveContainer>
        <Legend items={top4Keys.map((k,i)=>[top4Colors[i],top4Names[i]])}/>
        <div style={{fontSize:10,color:P.muted,marginTop:6,fontStyle:'italic',lineHeight:1.4}}>
          Pondere = categorie / total cifră de afaceri lună. Vedere normalizată: izolează evoluția mix-ului de creșterea rețelei (clinici noi non-comparabile).

      </Card>
    </div>

    {/* Detail table */}
    {/* Mix pe Clinici — stacked 100% din slide-ul Sales Split */}
    <Card style={{marginBottom:16}}>
      <Sec>Mix pe Clinici — {catPLabel}</Sec>
      <SafeBox>{CLINIC_MIX[ACT_MO] ? (()=>{
        const mixSrc = CLINIC_MIX[ACT_MO][period==='Month'?'M':'Y'];
        const data = MIX_CLINICS.filter(([code])=>mixSrc[code]).map(([code,name])=>({name, ...mixSrc[code]}));

            <Tooltip content={<TipPct/>}/>
            {MIX_STACK.map(k=>{ const c = CAT_LIST.find(x=>x.key===k); return (
              <Bar key={k} dataKey={k} stackId="mix" name={c.name} fill={c.color}>

        <div style={{fontSize:10,color:P.muted,marginTop:6,fontStyle:'italic',lineHeight:1.4}}>

    <Card>

              <th style={{padding:'8px 10px',textAlign:'right',fontWeight:700,color:P.primary,fontSize:10}}>{period==='YTD' ? 'Pondere YTD 25' : 'Pondere '+CAT_MONTHS[CIDX()-12]}</th>
              <th style={{padding:'8px 10px',textAlign:'right',fontWeight:700,color:P.primary,fontSize:10}}>{period==='YTD' ? 'Pondere YTD 26' : 'Pondere '+CAT_MONTHS[CIDX()]}</th>

          </thead>

            <tr style={{background:P.soft,borderTop:`2px solid ${P.primary}`,fontWeight:700}}>
              <td style={{padding:'9px 10px'}}/>

// ─── Buget vs Realizat · Lunar per Clinică (Ian–Dec 2026) ─────────────────────
// Bugetul se vede integral pe tot anul, indiferent de luna selectată în raport.
// Realizatul (actual) se afișează doar până la luna selectată (ACT_MO) — restul anului e "plan".
function MonthlyBudgetCard() {
  const [mode, setMode] = useState('pct'); // 'pct' | 'ron'
  const [expand, setExpand] = useState(null); // clinic code or null

  const rows = Object.values(CD).map(c=>{
    const act = MB_MONTHS.map((_,i)=> i<ACT_MO ? (c.actuals[2026]?.[i] ?? null) : null);
    const bud = MB_MONTHS.map((_,i)=> c.budget?.[2026]?.[i] ?? null);
    const has = bud.some(x=>x!=null);
    const fyBudget = bud.some(x=>x!=null) ? sum(bud.filter(x=>x!=null)) : null;
    return {...c, act, bud, has, fyBudget};
  }).filter(r=>r.has);

  const totAct = MB_MONTHS.map((_,i)=> i<ACT_MO ? NET.actuals[2026][i] : null);
  const totBud = MB_MONTHS.map((_,i)=> NET.budget[2026][i]);
  const totFYBudget = sum(totBud.filter(x=>x!=null));

  const heat = (v) => {
    if(v==null) return 'transparent';
    const t = Math.max(-1,Math.min(1, v/25));
    return t>=0 ? `rgba(21,128,61,${(0.07+0.32*t).toFixed(3)})` : `rgba(217,48,37,${(0.07+0.32*(-t)).toFixed(3)})`;
  };

  // Budget is always the dominant figure in every cell; the secondary line depends on mode/period.
  const Cell = ({a,b,mi,bold}) => {
    const isFuture = mi>=ACT_MO;
    const v = (!isFuture && a!=null && b!=null && b!==0) ? ((a-b)/b*100) : null;
    if(b==null) return <span style={{color:P.muted,fontSize:10}}>—</span>;
    return <div>
      <div style={{fontSize:bold?12:11.5,fontWeight:800,color:isFuture?P.amber:'#92660a'}}>{fmt(b)}</div>
      {mode==='pct'
        ? (isFuture
            ? <div style={{fontSize:8.5,color:P.muted,marginTop:2,fontStyle:'italic',letterSpacing:0.3}}>plan</div>
            : <div style={{fontSize:9.5,fontWeight:700,marginTop:2,color:v==null?P.muted:v>=0?'#15803D':P.alert}}>{v!=null?pct0(v):'—'}</div>)
        : (isFuture
            ? <div style={{fontSize:8.5,color:P.muted,marginTop:2,fontStyle:'italic',letterSpacing:0.3}}>plan</div>
            : <div style={{fontSize:9,color:a!=null?P.text:P.muted,marginTop:2}}>{a!=null?'act '+fmt(a):'—'}</div>)
      }
    </div>;
  };

  return (
    <Card style={{marginBottom:16,padding:0,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
      <div style={{background:P.primary,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:P.white,fontFamily:"'Playfair Display',serif",letterSpacing:0.3}}>Buget 2026 · Lunar per Clinică</div>
          <div style={{fontSize:10,color:'rgba(255,255,255,0.55)',marginTop:2,letterSpacing:0.5}}>Ianuarie – Decembrie 2026 · realizat până în {MONTHS_FULL[ACT_MO-1]} · sursă: Buget 2026 pe clinică</div>
        </div>
        <div style={{display:'flex',alignItems:'center',background:'rgba(0,0,0,0.25)',borderRadius:20,padding:3,gap:2}}>
          {[['pct','Abatere %'],['ron','RON']].map(([v,l])=>{ const on=mode===v; return (
            <button key={v} onClick={()=>setMode(v)} style={{
              background:on?'#ffffff':'transparent',color:on?P.primary:'rgba(255,255,255,0.7)',
              border:'none',cursor:'pointer',borderRadius:16,padding:'4px 13px',
              fontSize:10.5,fontWeight:700,fontFamily:"'Poppins',sans-serif",letterSpacing:'0.03em',
            }}>{l}</button>
          );})}
        </div>
      </div>

      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,tableLayout:'auto'}}>
          <thead>
            <tr style={{background:'#F8F4F4'}}>
              <th style={{padding:'9px 16px',textAlign:'left',fontWeight:700,color:P.primary,fontSize:11,borderBottom:`1px solid ${P.border}`,minWidth:120}}>Clinică</th>
              {MB_MONTHS.map((m,mi)=>{ const isFuture=mi>=ACT_MO; return (
                <th key={m} style={{padding:'9px 6px',textAlign:'center',fontWeight:isFuture?600:700,color:isFuture?P.amber:P.muted,fontSize:10,borderBottom:`1px solid ${P.border}`,background:isFuture?`${P.amber}0D`:'transparent',borderLeft:mi===ACT_MO?`2px dashed ${P.amber}66`:'none'}}>
                  {m}{isFuture&&<div style={{fontSize:7.5,fontWeight:600,letterSpacing:0.4,marginTop:1}}>PLAN</div>}
                </th>
              );})}
              <th style={{padding:'9px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:10,borderBottom:`1px solid ${P.border}`,borderLeft:`3px solid ${P.amber}55`,background:`${P.amber}12`}}>Buget FY26</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r=>{
              const isC1=r.cluster===1;
              const isOpen=expand===r.code;
              return (
                <React.Fragment key={r.code}>
                <tr style={{borderBottom:`1px solid #F0F0F0`,cursor:'pointer'}}
                  onClick={()=>setExpand(isOpen?null:r.code)}
                  onMouseEnter={e=>e.currentTarget.style.background='#FDF5F5'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <td style={{padding:'9px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{width:3,height:22,borderRadius:2,background:isC1?P.primary:P.olive,flexShrink:0}}/>
                      <div style={{fontWeight:700,color:P.primary,fontSize:11}}>{r.name}</div>
                      <span style={{fontSize:9,color:P.muted,marginLeft:2,transform:isOpen?'rotate(90deg)':'none',transition:'transform 0.15s',display:'inline-block'}}>▸</span>
                    </div>
                  </td>
                  {MB_MONTHS.map((m,mi)=>{
                    const a=r.act[mi], b=r.bud[mi];
                    const isFuture=mi>=ACT_MO;
                    const v=(!isFuture&&a!=null&&b!=null&&b!==0)?((a-b)/b*100):null;
                    return (
                      <td key={m} style={{padding:'6px 4px',textAlign:'center',background:isFuture?`${P.amber}0D`:(mode==='pct'?heat(v):'transparent'),borderLeft:mi===ACT_MO?`2px dashed ${P.amber}44`:'none'}}>
                        <Cell a={a} b={b} mi={mi}/>
                      </td>
                    );
                  })}
                  <td style={{padding:'6px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:11.5,borderLeft:`3px solid ${P.amber}33`,background:`${P.amber}08`}}>{fmt(r.fyBudget)}</td>
                </tr>
                {isOpen && (
                  <tr>
                    <td colSpan={MB_MONTHS.length+2} style={{padding:'6px 16px 16px',background:'#FCFAF9'}}>
                      <ResponsiveContainer width="100%" height={160}>
                        <ComposedChart data={MB_MONTHS.map((m,mi)=>({month:m,Actual:r.act[mi],Buget:r.bud[mi]}))} barCategoryGap="34%">
                          <CartesianGrid strokeDasharray="3 3" stroke="#F0F0F0" vertical={false}/>
                          <XAxis dataKey="month" tick={{fontSize:10,fill:P.muted}} axisLine={false} tickLine={false}/>
                          <YAxis tickFormatter={v=>fmt(v)} tick={{fontSize:9,fill:P.muted}} axisLine={false} tickLine={false} width={44}/>
                          <Tooltip content={<Tip/>}/>
                          <Bar dataKey="Actual" fill={isC1?P.primary:P.olive} radius={[3,3,0,0]} name="Actual" barSize={18}/>
                          <Line type="monotone" dataKey="Buget" stroke={P.amber} strokeWidth={2} strokeDasharray="5 4" dot={{r:3,fill:P.amber,strokeWidth:0}} name="Buget" connectNulls/>
                        </ComposedChart>
                      </ResponsiveContainer>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
            {/* TOTAL RETEA */}
            <tr style={{borderTop:`2px solid ${P.primary}`,background:`linear-gradient(90deg,${P.primary}08 0%,${P.primary}03 100%)`}}>
              <td style={{padding:'10px 16px',fontWeight:800,color:P.primary,fontSize:11.5,fontFamily:"'Playfair Display',serif"}}>TOTAL REȚEA</td>
              {MB_MONTHS.map((m,mi)=>{
                const a=totAct[mi], b=totBud[mi];
                const isFuture=mi>=ACT_MO;
                return (
                  <td key={m} style={{padding:'8px 4px',textAlign:'center',background:isFuture?`${P.amber}0D`:'transparent',borderLeft:mi===ACT_MO?`2px dashed ${P.amber}44`:'none'}}>
                    <Cell a={a} b={b} mi={mi} bold/>
                  </td>
                );
              })}
              <td style={{padding:'10px 10px',textAlign:'right',fontWeight:800,color:P.amber,fontSize:12.5,fontFamily:"'Playfair Display',serif",borderLeft:`3px solid ${P.amber}55`,background:`${P.amber}12`}}>{fmt(totFYBudget)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style={{padding:'8px 16px 10px',borderTop:`1px solid ${P.border}`,background:'#FAFAFA'}}>
        <span style={{fontSize:10,color:P.muted}}>Cifra bold = Buget lunar (mereu vizibil, an complet) · sub linie = {mode==='pct'?'abatere % vs realizat':'actual realizat'} · lunile de la {MONTHS[ACT_MO]||'—'} încolo sunt buget planificat (fără actual încă) · click pe o clinică pentru graficul Actual vs Buget</span>
        {Object.entries(BUDGET_FLAGS).map(([k,t])=><div key={k} style={{marginTop:8}}><Pill type="amber"><b>{CD[k].name} — buget de confirmat:</b> {t}</Pill></div>)}
      </div>
    </Card>
  );
}

// ─── Comparative Tab ──────────────────────────────────────────────────────────
// Full clinic comparison table ("Toate Clinicile") — lives in the Rețea (Network) tab.
function AllClinicsTable({period}) {
  // Helper: full year sum for a clinic/year
  const fy = (c, yr) => { const a=c.actuals?.[yr]; if(!a) return null; const v=a.filter(x=>x!=null); return v.length===12?sum(v):null; };
  const rows=Object.values(CD).map(c=>({
    ...c,
    v22:val(c,2022,period), v23:val(c,2023,period),
    v24:val(c,2024,period), v25:val(c,2025,period), v26:val(c,2026,period),
    bv:bval(c,2026,period),
    yoy:gr(val(c,2026,period),val(c,2025,period)),
    vsBgt:gr(val(c,2026,period),bval(c,2026,period)),
    fy2423:gr(fy(c,2024),fy(c,2023)),
    fy2524:gr(fy(c,2025),fy(c,2024)),
    hasAny2026:(c.actuals[2026]||[]).some(x=>x!=null),
  }));
  const n26=netv(period), n25=sum(period==='Month'?[NET.actuals[2025][ACT_MO-1]]:period==='YTD'?NET.actuals[2025].slice(0,ACT_MO):NET.actuals[2025].filter(x=>x!==null));
  const n24=sum(period==='Month'?[NET.actuals[2024][ACT_MO-1]]:period==='YTD'?NET.actuals[2024].slice(0,ACT_MO):NET.actuals[2024].filter(x=>x!==null));
  const n23=sum(period==='Month'?[NET.actuals[2023][ACT_MO-1]]:period==='YTD'?NET.actuals[2023].slice(0,ACT_MO):NET.actuals[2023].filter(x=>x!==null));
  const n22=sum(period==='Month'?[NET.actuals[2022][ACT_MO-1]]:period==='YTD'?NET.actuals[2022].slice(0,ACT_MO):NET.actuals[2022].filter(x=>x!==null));
  const nb=netb(period);
  // Full year network YoY
  const nFY25=sum(NET.actuals[2025].filter(x=>x!=null)), nFY24=sum(NET.actuals[2024].filter(x=>x!=null));
  const nFY23=sum(NET.actuals[2023].filter(x=>x!=null));
  const nFY2423=gr(nFY24,nFY23);
  const nFY2524=gr(nFY25,nFY24);
  const lfl26=LFL.reduce((a,c)=>a+(val(CD[c],2026,period)||0),0);
  const lfl25=LFL.reduce((a,c)=>a+(val(CD[c],2025,period)||0),0);
  const lflb=LFL.reduce((a,c)=>a+(bval(CD[c],2026,period)||0),0);
  // Full year LFL YoY — același set de clinici în ambii ani: doar clinicile cu 12 luni complete
  // în AMBII ani comparați (altfel o clinică deschisă în anul de bază umflă creșterea, ex. CLR din Feb 24).
  const full12=(c,yr)=>{ const v=CD[c].actuals?.[yr]; return v&&v.filter(x=>x!=null).length===12; };
  const lflFYset=(y1,y0)=>LFL.filter(c=>full12(c,y1)&&full12(c,y0));
  const lflFYsum=(codes,yr)=>codes.reduce((a,c)=>a+sum(CD[c].actuals[yr]),0);
  const lflSet2423=lflFYset(2024,2023), lflSet2524=lflFYset(2025,2024);
  const lflFY2423=lflSet2423.length?gr(lflFYsum(lflSet2423,2024),lflFYsum(lflSet2423,2023)):null;
  const lflFY2524=lflSet2524.length?gr(lflFYsum(lflSet2524,2025),lflFYsum(lflSet2524,2024)):null;

              {/* YOY */}

              </td>

              </td>
              <td style={{padding:'11px 12px',textAlign:'right',fontWeight:800,fontSize:12,color:(n26-nb)>=0?'#15803D':P.alert}}>{(n26-nb)>=0?'+':''}{fmt(n26-nb)}</td>

            {/* TOTAL LFL */}

                {lflFY2524!=null&&<span title={`Set comparabil FY 25/24 (12 luni în ambii ani): ${lflSet2524.join(', ')}`} style={{display:'inline-block',padding:'3px 9px',borderRadius:20,fontSize:11,fontWeight:700,background:lflFY2524>=0?'#EDE9FF':'#FEE2E2',color:lflFY2524>=0?'#4C2F8A':P.alert,boxShadow:'0 1px 4px rgba(91,63,138,0.15)'}}>{pct(lflFY2524)}</span>}
              </td>

                <span style={{display:'inline-block',padding:'2px 7px',borderRadius:20,fontSize:10,fontWeight:700,background:gr(lfl26,lflb)>=0?'#FFFBEB':'#FEF2F2',color:gr(lfl26,lflb)>=0?'#92400E':P.alert}}>{pct(gr(lfl26,lflb))}</span>

// ─── Pacienți Tab — Marketing & Acquisition | Pacienți ────────────────────────
// Urmează luna selectată din raport (ACT_MO), la fel ca Ops-Med/Ops-Sales. Trei blocuri, în ordinea
// din capitolul sursă: (1) Acquisition & Retention — P0/pacienți lunari/noi, KPI + trend; (2) Canale
// de achiziție — split MTD al lunii curente; (3) Life Time Value per canal — instantaneu static.
// Etichetă cu tooltip la mouse-over (aceeași mecanică vizuală ca IndicatorLabel din Ops-Med — clase
// .da-info/.da-info-tip, definite global) — folosită în tab-ul Pacienți pentru a clarifica diferența
// dintre P0 (înregistrare în sistem) și P1 (vizită efectiv realizată), ca să nu se confunde cele două
// stadii de funnel sau sursele lor de date.
function InfoTip({children,full,calc}) {
  return (
    <span className="da-info" style={{borderBottom:`1px dotted ${P.muted}`,cursor:'help',display:'inline-block'}}>
      {children}
      <span className="da-info-tip" style={{background:P.primary,color:P.white,fontSize:10.5,fontWeight:400,lineHeight:1.4,padding:'8px 11px',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,0.22)'}}>
        {full && <div style={{fontWeight:700,marginBottom:calc?4:0}}>{full}</div>}
        {calc && <div style={{color:'rgba(255,255,255,0.85)'}}>{calc}</div>}
      </span>
    </span>
  );
}

function ChannelBar({label,value,max,color}) {
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,marginBottom:3}}>
        <span style={{color:P.text,fontWeight:500}}>{label}</span>
        <span style={{color:P.primary,fontWeight:700}}>{value.toFixed(1)}%</span>
      </div>
      <div style={{background:'#F2ECEA',borderRadius:6,height:9,overflow:'hidden'}}>
        <div style={{width:`${Math.max(value/max*100,1.5)}%`,height:'100%',background:color,borderRadius:6}}/>
      </div>

}

function FeedbackTab() {
  const i = ACT_MO-1;
  const ei = PATIENTS_OFF+i;
  const dPct = (arr) => i>0 && arr[ei-1] ? Math.round((arr[ei]-arr[ei-1])/arr[ei-1]*100) : null;
  const yoyPct = (arr) => ei-12>=0 && arr[ei-12] ? Math.round((arr[ei]-arr[ei-12])/arr[ei-12]*100) : null;
  const allCodes = C1.concat(C2);
  const fbSumSeries = (codes, table) => PATIENTS_MONTHS_18.map((_,idx)=>{
    const vals = codes.map(c=>table[c]?.[idx]).filter(v=>v!=null);
    return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
  });
  const totalSeries = fbSumSeries(allCodes, FEEDBACK_CLINICS_NO_18);
  const negSeries = fbSumSeries(allCodes, FEEDBACK_CLINICS_NEG_18);
  const totalNow = totalSeries[ei], negNow = negSeries[ei];
  const negPctNow = (totalNow!=null && negNow!=null && totalNow>0) ? Math.round(negNow/totalNow*1000)/10 : null;
  const googleNow = FEEDBACK_GOOGLE_18[ei], googlePctNow = FEEDBACK_GOOGLE_PCT_18[ei];

  const trend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Total feedback':totalSeries[k],'Feedback negativ':negSeries[k],is2025:k<PATIENTS_OFF})).filter(d=>d['Total feedback']!=null);
  const googleTrend = PATIENTS_MONTHS_18.map((m,k)=>({month:m,'Recenzii Google':FEEDBACK_GOOGLE_18[k],'% către Google':FEEDBACK_GOOGLE_PCT_18[k]}));

  const clinicRows = allCodes.map(code=>{
    const noArr = FEEDBACK_CLINICS_NO_18[code], negArr = FEEDBACK_CLINICS_NEG_18[code];
    const v = noArr[ei], vPrev = ei>0?noArr[ei-1]:null;
    const neg = negArr[ei];
    const negPct = (v!=null && neg!=null && v>0) ? Math.round(neg/v*1000)/10 : null;
    const mom = (v!=null && vPrev!=null && vPrev>=5) ? Math.round((v-vPrev)/vPrev*100) : null;
    return {code, name:MED_CLINIC_NAMES[code], v, neg, mom, negPct};
  });
  const clusterSum = (codes) => {
    const rows = clinicRows.filter(r=>codes.includes(r.code));
    const v = rows.reduce((s,r)=>s+(r.v||0),0), neg = rows.reduce((s,r)=>s+(r.neg||0),0);
    return {v, neg, negPct: v>0 ? Math.round(neg/v*1000)/10 : null};
  };

  const TrendTip = ({active,payload,label}) => {
    if(!active||!payload?.length) return null;
    return <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:8,padding:'10px 14px',fontSize:11,boxShadow:'0 4px 16px rgba(0,0,0,0.10)',fontFamily:"'Poppins',sans-serif"}}>

      </div>)}

  return <div>
    {/* ── Antet Feedback: volum + satisfacție + rată de răspuns + Google, apoi analiză calculată ── */}
    {(()=>{
      const good='#15803D', bad=P.alert;
      const arrow=v=>v==null?'—':`${v>=0?'▲':'▼'} ${Math.abs(v)}%`;
      const mom=dPct(totalSeries), yoy=yoyPct(totalSeries);
      const sat=negPctNow!=null?Math.round((100-negPctNow)*10)/10:null;
      const last12=k=>{ const T=totalSeries.slice(Math.max(0,k-11),k+1), N=negSeries.slice(Math.max(0,k-11),k+1); const t=T.reduce((a,b)=>a+(b||0),0), n=N.reduce((a,b)=>a+(b||0),0); return t?Math.round(n/t*1000)/10:null; };
      const neg12=last12(ei);

      const vzTot=cov.reduce((a,r)=>a+(r.vz||0),0), rateNet=vzTot&&totalNow?Math.round(totalNow/vzTot*1000)/10:null;
      const covSorted=cov.filter(r=>r.rate!=null).sort((a,b)=>a.rate-b.rate);
      const lowCov=covSorted.filter(r=>rateNet&&r.rate<rateNet/2);
      const gIdx=(()=>{ for(let k=ei;k>=0;k--) if(FEEDBACK_GOOGLE_18[k]!=null) return k; return null; })();
      const gMissing=gIdx!==ei;
      const gVals=FEEDBACK_GOOGLE_PCT_18.filter(v=>v!=null), gAvg=gVals.length?Math.round(gVals.reduce((a,b)=>a+b,0)/gVals.length):null;
      const m26=MONTHS.slice(0,ACT_MO).map((m,k)=>({m,tot:totalSeries[PATIENTS_OFF+k],neg:negSeries[PATIENTS_OFF+k]}));
      const maxT=Math.max(...m26.map(x=>x.tot||0));
      const highNeg=clinicRows.filter(r=>r.negPct!=null&&r.negPct>=2);
      const zeroNeg=clinicRows.filter(r=>r.neg===0&&r.v>0);
      const drops=clinicRows.filter(r=>r.mom!=null&&r.mom<=-30);
      const msgs=(FEEDBACK_MESSAGES[ACT_MO]||[]).length;
      const pos=[], watch=[];
      if(sat!=null) (negPctNow<=1?pos:watch).push({t:`Satisfacție ${sat}% · ${negNow} review-uri negative din ${totalNow}`, d:`Rata negativă ${negPctNow}% vs ${neg12}% media ultimelor 12 luni${negPctNow<=neg12?' — sub medie':' — peste medie'}.`});
      if(zeroNeg.length) pos.push({t:`${zeroNeg.length} clinici fără niciun review negativ`, d:zeroNeg.map(r=>`${r.name} (${r.v})`).join(' · ')+'.'});
      if(!gMissing&&googlePctNow!=null&&gAvg!=null) (googlePctNow>=gAvg?pos:watch).push({t:`${googlePctNow}% din feedback-ul pozitiv ajunge pe Google`, d:`${googleNow} recenzii · media ${gAvg}%.`});
      if(highNeg.length) watch.push({t:`Rată negativă ridicată: ${highNeg.map(r=>r.name).join(', ')}`, d:highNeg.map(r=>`${r.name} ${r.neg}/${r.v} (${r.negPct}%)`).join(' · ')+(highNeg.some(r=>r.v<20)?' — volum mic, un singur review mută mult rata.':'.')});
      if(lowCov.length) watch.push({t:`Acoperire slabă: ${lowCov.map(r=>r.name).join(', ')}`, d:`${lowCov.map(r=>`${r.name} ${r.rate}% (${r.v} feedback / ${r.vz} vizite)`).join(' · ')} vs ${rateNet}% în rețea — satisfacția raportată acolo se bazează pe puține răspunsuri.`});
      if(drops.length) watch.push({t:`Scădere bruscă de feedback față de ${MONTHS[i-1]}`, d:drops.map(r=>`${r.name} ${r.mom}%`).join(' · ')+' — verificați dacă solicitarea feedback-ului s-a oprit.'});
      if(gMissing) watch.push({t:`Recenzii Google ${MONTHS[i]}: date neimportate`, d:`Puls nu are încă datele Google pentru ${MONTHS[i]} 2026 (ultima lună disponibilă: ${PATIENTS_MONTHS_18[gIdx]}).`});
      if(msgs) watch.push({t:`${msgs} mesaje negative în ${MONTHS[i]}`, d:'Textul integral e mai jos, în secțiunea „Mesaje recente — feedback negativ".'});
      return (<>
      <div style={{marginBottom:16}}>
        <div className="net-head">
          <div className="net-hero" style={{background:`linear-gradient(145deg, ${P.primary} 0%, #5E140F 100%)`,borderRadius:14,padding:'18px 20px',color:P.white,boxShadow:'0 4px 18px rgba(123,28,22,0.22)',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:0.9,textTransform:'uppercase',color:'rgba(255,255,255,0.7)'}}>

            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

            <div>

                {m26.map((x,k)=>(
                  <div key={x.m} title={`${x.m} 26: ${x.tot} feedback · ${x.neg} negative`} style={{flex:1,height:'100%',display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'center',gap:2}}>
                    <span style={{fontSize:9,fontWeight:700,lineHeight:1,color:x.neg>0?'#FFB4AB':'rgba(255,255,255,0.35)'}}>{x.neg}</span>

                  </div>))}
              </div>
              <div style={{display:'flex',gap:4,marginTop:4}}>
                {m26.map((x,k)=><div key={x.m} style={{flex:1,textAlign:'center',fontSize:8.5,color:k===i?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.45)'}}>{x.m}</div>)}
              </div>
              <div style={{fontSize:9,color:'rgba(255,255,255,0.55)',marginTop:4}}>bară = feedback total 2026 · cifra de deasupra = review-uri negative · sursă: Puls (Monthly brief)</div>
            </div>
          </div>

          <HeadTile label={<InfoTip full="Satisfacție" calc="100% − rata de feedback negativ (review-uri 0-3 stele / total feedback), la nivel de rețea, în luna selectată.">Satisfacție</InfoTip>} value={sat!=null?`${sat}%`:'—'} valueColor={negPctNow!=null&&negPctNow<=1?good:bad} caption="feedback pozitiv">

              {[covSorted[covSorted.length-1],covSorted[0]].map((r,q)=>(

            </div>}
            <div style={{color:P.muted,marginTop:4}}>cea mai mare vs cea mai mică acoperire · {vzTot.toLocaleString('en-US')} vizite în rețea</div>

            <div style={{color:P.muted,marginTop:3}}>medie 20 luni: {gAvg}% din pozitive ajung pe Google</div>
          </HeadTile>
        </div>
      </div>
      <InsightPanel title="Analiză feedback" sub={`${MONTHS[i]} 2026 · calculat din date`} pos={pos} watch={watch}/>
      </>);
    })()}

// ─── Comparative Tab → "Buget" ─────────────────────────────────────────────────
function ComparativeTab({period}) {
  const rows=Object.values(CD).map(c=>({
    ...c,
    yoy:gr(val(c,2026,period),val(c,2025,period)),
    vsBgt:gr(val(c,2026,period),bval(c,2026,period)),
    hasAny2026:(c.actuals[2026]||[]).some(x=>x!=null),
  }));
  const bars=rows.filter(r=>r.hasAny2026);

  return <div>
    <MonthlyBudgetCard/>

          </BarChart>

      <Card>
